function ensureFacultyConfig(){

function consolidateInformationTechnologyDepartment(){
  const retiredIds=new Set(['DEP-IT',...state.departments
    .filter(department=>recordKey(department.name)==='information technology'||recordKey(department.code)==='it')
    .map(department=>department.id)]);
  const hasLegacyITLabel=record=>['it','information technology'].includes(recordKey(record.department));
  const faculty=state.faculty.filter(record=>record.departmentIds.some(id=>retiredIds.has(id))||
    (!record.departmentIds.length&&hasLegacyITLabel(record)));
  const courses=state.courses.filter(record=>retiredIds.has(record.departmentId)||
    (!record.departmentId&&hasLegacyITLabel(record)));
  if(faculty.length||courses.length){
    const department=state.departments.find(x=>!retiredIds.has(x.id)&&
      (recordKey(x.name)==='computer studies'||recordKey(x.code)==='cs'))??
      migrateFacultyCatalogEntry(state.departments,'DEP','Computer Studies');
    for(const record of faculty){
      record.departmentIds=[...new Set([department.id,...record.departmentIds.filter(id=>!retiredIds.has(id))])];
    }
    for(const record of courses)record.departmentId=department.id;
  }
  for(const record of state.faculty)delete record.department;
  state.departments=state.departments.filter(department=>!retiredIds.has(department.id));

function installFacultyRoster(){

  const isSample=faculty=>replacedSampleFaculty.has(faculty.id)&&
    recordKey(replacedSampleFaculty.get(faculty.id))===recordKey(faculty.name);
  const referencedIds=new Set([...state.schedules,...(state.publishedSchedules??[]),...(state.assignmentDrafts??[])]
    .map(record=>record.facultyId));
  state.retiredSampleFaculty=state.faculty.filter(faculty=>isSample(faculty)&&referencedIds.has(faculty.id))
    .map(({id,name})=>({id,name}));
  const sampleIds=new Set(state.faculty.filter(isSample).map(faculty=>faculty.id));
  state.faculty=state.faculty.filter(faculty=>!sampleIds.has(faculty.id));
  state.facultyCourseMatches=(state.facultyCourseMatches??[]).filter(match=>!sampleIds.has(match.facultyId));
  const nameKey=name=>recordKey(name).normalize('NFC');
  let sequence=0;
  for(const [defaultId,code,name,names] of facultyRoster){
    const alias={CS:'computer science',HM:'hospitality management',BUS:'business and accountancy'}[code];
    let department=state.departments.find(item=>recordKey(item.code)===recordKey(code))??
      state.departments.find(item=>[recordKey(name),alias].includes(recordKey(item.name)));
    if(!department){
      const id=find(state.departments,defaultId)?newRecordId('DEP',state.departments):defaultId;
      department={id,code,name,description:'',isActive:true};
      state.departments.push(department);
    }
    for(const professorName of names){
      const existing=state.faculty.find(faculty=>nameKey(faculty.name)===nameKey(professorName));
      const defaultFacultyId='F-ROSTER-'+String(++sequence).padStart(2,'0');
      if(existing){
        if(!existing.departmentIds.includes(department.id))existing.departmentIds.push(department.id);
      }else{
        const id=find(state.faculty,defaultFacultyId)?newRecordId('F',state.faculty):defaultFacultyId;
        state.faculty.push({id,name:professorName,departmentIds:[department.id],employmentTypeId:null});

}

function migrateFacultyCatalogEntry(records,prefix,name){
  if(!name)return null;
  const existing=records.find(x=>recordKey(x.name)===recordKey(name));
  if(existing)return existing;
  const id=newRecordId(prefix,records);
  const base=name.toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'')||prefix;
  let code=base;
  for(let suffix=2;records.some(x=>recordKey(x.code)===recordKey(code));suffix++)code=base+'-'+suffix;
  const entry={id,code,name,description:'Migrated from an existing faculty record',isActive:true};
  records.push(entry);
  return entry;
}

function facultyRecommendation(faculty,plans,previous){
  const other=activeMeetings().filter(x=>!previous.includes(x)&&x.facultyId===faculty.id);
  const requirements=plans.map(plan=>teachingActivities(findCourse(plan.courseId)).find(x=>x.id===plan.activity));
  const proposed=assignedTeachingLoad(requirements.map(x=>({teachingLoadUnits:x?.load})));
  const load=teachingLoadSummary(faculty.employmentTypeId,workingTeachingLoad(other),proposed);
  const planned=plans.map(plan=>planMeetings(plan));
  const occurrences=planned.flatMap((result,index)=>result.error?[]:result.meetings.map(x=>({...plans[index],...x,facultyId:faculty.id})));
  const timeConflict=occurrences.some(x=>other.some(y=>facultyOverlap(x,y)))||
    occurrences.some((x,index)=>occurrences.slice(index+1).some(y=>facultyOverlap(x,y)));
  const atLimit=load.remaining!==null&&(load.remaining<0||load.canAccept===false||proposed>0&&load.status==='At Load Limit');
  const unknown=planned.some(x=>x.error)||load.remaining===null||proposed===null;
  const status=timeConflict?'Time Conflict':atLimit?'At Load Limit':unknown?'Availability Not Yet Determined':'Available';
  return {load,status,blocked:timeConflict||atLimit,order:timeConflict||atLimit?2:unknown?1:0};
}

function facultyLoad(facultyId,employmentTypeId,proposed=null){

function teachingLoadSummary(employmentTypeId,assigned,proposed=null){
  const employment=find(state.employmentTypes,employmentTypeId);
  const maximum=validMaxLoad(employment?.maxLoad)?employment.maxLoad:null;
  const remaining=maximum===null||assigned===null?null:maximum-assigned;
  const tolerance=Number.EPSILON*Math.max(maximum??0,assigned??0)*4;
  const status=remaining===null?'Load Not Calculated':Math.abs(remaining)<=tolerance?'At Load Limit':
    remaining<0?'Overloaded':'Available Capacity';
  const canAccept=remaining===null||!validMaxLoad(proposed)?null:proposed<=remaining+tolerance;
  return {maximum,assigned,remaining,status,canAccept};
}

function ensureCourseGroups(){

  const assignedIds=new Set([...state.schedules,...(state.publishedSchedules??[])].map(x=>x.sectionId));
  const curriculumDrafts=[];
  const legacySections=[...state.sections].sort((a,b)=>Number(assignedIds.has(b.id))-Number(assignedIds.has(a.id)));
  for(const section of legacySections){

    const semester=find(state.semesters,section.semesterId)||state.semesters.find(x=>x.order===Number(section.semester));
    const yearLevel=Number(section.year);
    if(!program||!semester||!Number.isSafeInteger(yearLevel)||yearLevel<1){

    const requiredCourseIds=[...new Set(section.courses??[])];
    const identity={academicProgramId:program.id,yearLevel,semesterId:semester.id};
    const draft=/^B\d+-\d+$/.test(section.id)&&!assignedIds.has(section.id)&&!Object.hasOwn(section,'students');
    let group=groupByIdentity(identity);

    if(planned.error)return {error:'Inherited template needs review. '+planned.error};
    for(const professor of faculty){
      for(const room of rooms){
        const plan={...task,...template,facultyId:professor.id,roomId:room.id};

  }
  for(const pattern of patterns){
    for(const shift of state.dateDays.shifts.filter(x=>x.isActive)){
      const candidate={...task,...pattern,shiftId:shift.id};
      for(const start of scheduleStartOptions(candidate).options){
        const base={...candidate,start};
        const planned=planMeetings(base);
        if(planned.error)break;
        for(const professor of faculty){
          for(const room of rooms){
            const plan={...base,facultyId:professor.id,roomId:room.id};
            if(!validatePlan(plan,planned,meetings).length)return {entries:saveMeetings(plan,planned,[],meetings)};

function timetableShiftWindows(){
  const shifts=state.dateDays.shifts.filter(x=>x.isActive&&validTime(x.startTime)&&validTime(x.endTime)&&mins(x.startTime)<mins(x.endTime))
    .map(x=>({start:mins(x.startTime),end:mins(x.endTime)})).sort((a,b)=>a.start-b.start);
  const windows=[];
  for(const shift of shifts){
    const last=windows.at(-1);
    if(last&&shift.start<=last.end)last.end=Math.max(last.end,shift.end);
    else windows.push(shift);
  }
  return windows;
}
function timetableBounds(){

}

function timetableData(context){

  const results=plans.map(plan=>({plan,planned:planMeetings(plan)}));
  const planned=results.find(x=>x.planned.error)?.planned;
  const proposed=results.flatMap(({plan,planned})=>(roomMode&&planned.error?[]:planned.meetings??[])
    .map((x,index)=>({...plan,...x,facultyId:roomMode?plan.facultyId:id,previewKey:'proposed-'+plan.activity+'-'+index})));
  const ownIds=new Set((form?previousCourseMeetings(form):[]).map(x=>x.id));
  const otherMeetings=meetings.filter(x=>!ownIds.has(x.id)&&
    (!x.draftReservation||!plans.some(plan=>sameOffering(x,plan))));
  const conflicts=[...new Set(proposed.flatMap(x=>conflictsWith(x,otherMeetings)))];
  const items=[...meetings,...proposed].map(meeting=>{
    const interval=meetingInterval(meeting),isProposed=Boolean(meeting.previewKey);

      conflictsWith(meeting,proposed.filter(x=>x!==meeting)).length>0:
      conflicts.includes(meeting)||conflictsWith(meeting,meetings.filter(x=>x!==meeting)).length>0;
    const review=!bounds||!interval||!days.includes(meeting.day)||interval.start<bounds.start||interval.end>bounds.end||
      !state.dateDays.teachingDays.includes(meeting.day)||Boolean(isProposed&&planned?.error)||
      Boolean(meeting.shiftId&&(!shift?.isActive||interval.start<mins(shift.startTime)||interval.end>mins(shift.endTime)));
    const status=isProposed?'Proposed':!meeting.draftReservation&&confirmedMeeting(meeting,published)?'Confirmed':'Tentative';
    return {meeting,interval,isProposed,conflict,review,status};
  });

function timetableLanes(items){
  const ordered=[...items].sort((a,b)=>a.interval.start-b.interval.start||b.interval.end-a.interval.end);
  const clusters=[];
  for(const item of ordered){
    const cluster=clusters.at(-1);
    if(!cluster||item.interval.start>=cluster.end)clusters.push({end:item.interval.end,items:[item]});
    else{
      cluster.items.push(item);
      cluster.end=Math.max(cluster.end,item.interval.end);
    }
  }
  return clusters.flatMap(cluster=>{
    const laneEnds=[];
    const positions=cluster.items.map(item=>{
      const open=laneEnds.findIndex(end=>end<=item.interval.start);
      const lane=open===-1?laneEnds.length:open;
      laneEnds[lane]=item.interval.end;
      return {...item,lane};
    });
    return positions.map(item=>({...item,laneCount:laneEnds.length}));
  });
}

function roomAvailability(windows,entries){
  const occupied=entries.filter(x=>!x.isProposed).map(x=>x.interval).sort((a,b)=>a.start-b.start);
  return windows.flatMap(({start,end})=>{
    const free=[];
    let cursor=start;
    for(const reservation of occupied){
      if(reservation.end<=cursor||reservation.start>=end)continue;
      if(reservation.start>cursor)free.push({start:cursor,end:reservation.start});
      cursor=Math.max(cursor,reservation.end);
    }
    if(cursor<end)free.push({start:cursor,end});
    return free;
  });
}

function renderTimetable(){
  const context=timetableContext,data=timetableData(context),roomMode=data.roomMode;
  const notices=data.planned?.error?`<p class="note">Proposed assignment · ${esc(data.planned.error)}</p>`:'';
  const conflictMessage=roomMode?roomConflictMessage:facultyConflictMessage;
  const conflict=data.conflicts.length?`<div class="alert red"><strong>${roomMode?'Room':'Faculty'} Schedule Conflict</strong>
    <ul>${data.conflicts.map(x=>`<li>${esc(conflictMessage(x))}</li>`).join('')}</ul></div>`:'';
  const summary=roomMode?roomTimetableSummary(find(state.rooms,context.id)):
    facultyTimetableSummary(find(state.faculty,context.id),data.meetings);
  const emptyMessage=roomMode?'No classroom assignments for the selected academic term.':
    'No teaching assignments for this professor in the active term.';
  const footer=context.assignment?btn(context.fromPicker?'Back to Select Professor':'Back to Assignment','close-modal','btn btn-primary','arrow'):'';
  showModal(roomMode?'Classroom Timetable':'Faculty Timetable',`${summary}
    <div class="faculty-timetable-key"><span class="chip blue">Lecture</span><span class="chip purple">Laboratory</span>
      ${roomMode?'<span class="chip room-available-key">Available</span><span class="chip gray">Outside teaching hours</span>':''}
      <span class="chip green">Confirmed</span><span class="chip gray">Tentative</span><span class="chip amber">Proposed</span><span class="chip red">Conflict</span></div>
    <p class="note">${roomMode?'Available periods are open for room reservations. Assignment checks also cover facility suitability, faculty, and section schedules.':
      'Blank slots have no recorded meetings. Assignment checks also cover teaching load, rooms, and sections.'}</p>
    ${data.meetings.length?'':`<p class="note">${emptyMessage}</p>`}
    ${notices}${conflict}${weeklyTimetableGrid(data)}${timetableReviewList(data.items)}`,
    footer+(roomMode?(context.assignment?'':btn('Close','close-modal')):btn('Close Timetable','close-modal')), 'timetable');
  if(context.gridScroll){
    const grid=document.querySelector('.faculty-timetable-scroll');
    if(grid){grid.scrollTop=context.gridScroll.top;grid.scrollLeft=context.gridScroll.left}
  }
  if(context.meetingFocus){
    Array.from(document.querySelectorAll('[data-meeting-key]')).find(x=>x.dataset.meetingKey===context.meetingFocus)?.focus({preventScroll:true});
    context.meetingFocus=null;
  }else{
    document.querySelector('#modal-root .dialog').focus({preventScroll:true});
  }
}
function openTimetable(mode,id,trigger,form=null,fromPicker=false){
  if(!find(mode==='room'?state.rooms:state.faculty,id))return;
  const root=document.getElementById('modal-root');
  const assignment=fromPicker?professorPicker.assignment:form?root.firstElementChild:null;
  timetableContext={mode,id,trigger,assignment,fromPicker,assignmentScroll:assignment?.querySelector('.dialog').scrollTop};
  renderTimetable();
}
function timetableMeetingDetails(key){
  const context=timetableContext;
  const item=context&&timetableData(context).items.find(x=>(x.meeting.previewKey??x.meeting.id)===key);
  if(!item)return;
  const {meeting,interval,status,conflict,review}=item;
  const grid=document.querySelector('.faculty-timetable-scroll');
  if(grid)context.gridScroll={top:grid.scrollTop,left:grid.scrollLeft};
  context.meetingFocus=key;
  context.details=true;
  const section=find(state.sections,meeting.sectionId),group=sectionGroup(section);
  const details=[
    ['Academic Program',find(state.academicPrograms,group?.academicProgramId)?.name],
    ['Course Group',group&&groupCode(group)],['Section',sectionCode(section)],
    ['Professor',facultyName(meeting.facultyId)],['Activity',activityName(meeting)],
    ['Classroom',find(state.rooms,meeting.roomId)?.name||meeting.roomId],['Teaching Day',meeting.day],
    ['Teaching Shift',find(state.dateDays.shifts,meeting.shiftId)?.name],['Time',interval&&timeRange(meeting)],
    ['Session Duration',interval&&meeting.durationMinutes+' minutes'],['Academic Term',termLabel(meetingTerm(meeting))],
    ['Schedule Status',[status,conflict?'Conflict':'',review?'Needs review':''].filter(Boolean).join(' · ')]
  ];
  showModal('Teaching Meeting Details',`<h3>${esc(courseLabel(meeting.courseId))}</h3><dl class="faculty-meeting-details">
    ${details.map(([label,value])=>`<div><dt>${label}</dt><dd>${esc(value||'Unavailable')}</dd></div>`).join('')}</dl>`,
    btn('Back to Timetable','close-modal','btn btn-primary','arrow'));
  document.querySelector('#modal-root .dialog')?.focus();
}
function closeTimetable(){
  const context=timetableContext;
  if(context.details){
    context.details=false;
    renderTimetable();
    return;
  }
  timetableContext=null;
  const root=document.getElementById('modal-root');
  if(context.fromPicker){renderProfessorPicker();return}
  if(context.assignment){
    root.replaceChildren(context.assignment);
    root.querySelector('.dialog').scrollTop=context.assignmentScroll;
    root.querySelectorAll('[data-component]').forEach(updateAssignmentPreview);
  }else root.replaceChildren();
  context.trigger?.focus({preventScroll:true});
}

const configurationDeleteLabels={
  locations:'Building / Location',facilityTypes:'Facility Type',academicPrograms:'Academic Program',
  departments:'Department',semesters:'Semester',employmentTypes:'Employment Type'
};
function configurationDeleteButton(group,item){
  return btn('Delete','delete-configuration','btn btn-sm btn-danger','x',
    `data-group="${group}" data-id="${esc(item.id)}" aria-label="Delete ${esc(item.name)}"`);
}
function configurationDependencies(group,item){
  const id=item.id;
  switch(group){
    case 'locations':
      return state.rooms.some(room=>room.buildingLocationId===id)?['classrooms']:[];
    case 'facilityTypes': {
      const facility=item.legacyType||item.name;
      const required=state.courses.some(course=>teachingActivities(course)
        .some(activity=>activity.units>0&&activity.facility===facility));
      const alternative=state.facilityTypes.some(type=>type.id!==id&&(type.legacyType||type.name)===facility);
      return [state.rooms.some(room=>room.facilityTypeId===id)&&'classrooms',required&&!alternative&&'course facility requirements'].filter(Boolean);
    }
    case 'academicPrograms':
      return [
        state.courseGroups.some(courseGroup=>courseGroup.academicProgramId===id)&&'course groups',
        state.sections.some(section=>section.academicProgramId===id||
          !section.courseGroupId&&!section.academicProgramId&&programFromLabel(section.program)?.id===id)&&'sections'
      ].filter(Boolean);
    case 'departments':
      return [
        state.faculty.some(faculty=>faculty.departmentIds.includes(id))&&'faculty profiles',
        state.courses.some(course=>course.departmentId===id)&&'courses'
      ].filter(Boolean);
    case 'semesters':
      return [
        activeTerm().semesterId===id&&'the active academic term',
        state.courseGroups.some(courseGroup=>courseGroup.semesterId===id)&&'course groups',
        state.sections.some(section=>section.semesterId===id||
          !section.courseGroupId&&!section.semesterId&&Number(section.semester)===item.order)&&'sections',
        [...state.schedules,...(state.publishedSchedules??[]),...(state.assignmentDrafts??[])]
          .some(meeting=>meetingTerm(meeting).semesterId===id)&&'saved schedules or drafts'
      ].filter(Boolean);
    case 'employmentTypes':
      return state.faculty.some(faculty=>faculty.employmentTypeId===id)?['faculty profiles']:[];
  }
}
function deleteConfiguration(group,id,confirmed=false){
  if(!Object.hasOwn(configurationDeleteLabels,group))return;
  const item=find(state[group],id);
  if(!item)return;
  const label=configurationDeleteLabels[group];
  const dependencies=configurationDependencies(group,item);
  if(dependencies.length){
    const deactivate=group==='academicPrograms'&&item.isActive?
      btn('Deactivate','toggle-academic-program','btn btn-primary','x',`data-id="${esc(id)}" data-close-after-toggle`):'';
    showModal('Delete '+label,`<div class="alert amber"><strong>${esc(item.name)}</strong> is in use by ${esc(dependencies.join(', '))}.
      <p>${group==='academicPrograms'?'Deactivate the program to keep its records and schedules.':
        'Reassign or remove those references before deleting this record.'}</p></div>`,btn('Close','close-modal')+deactivate);
    return;
  }
  if(!confirmed){
    showModal('Delete '+label,`<p>Permanently delete <strong>${esc(item.name)}</strong>?</p>`,
      btn('Cancel','close-modal')+btn('Delete','confirm-delete-configuration','btn btn-danger','x',
        `data-group="${group}" data-id="${esc(id)}"`));
    return;
  }
  state[group]=state[group].filter(record=>record.id!==id);
  if(group==='locations'&&locationFilter===id)locationFilter='all';
  if(group==='facilityTypes'&&facilityFilter===id)facilityFilter='all';
  if(group==='departments'){
    if(courseDepartmentFilter===id)courseDepartmentFilter='';
    if(matchingDepartment===id){matchingDepartment='';matchingFaculty=''}
    if(professorPicker?.department===id)professorPicker.department='';
  }
  if(group==='academicPrograms'&&selectedProgramId===id)selectedProgramId='';
  if(group==='semesters'&&groupFilters.semester===id)groupFilters.semester='';
  const category=['locations','facilityTypes'].includes(group)?'Facility Configuration':
    group==='employmentTypes'?'Faculty Configuration':'Academic Configuration';
  log(label+' deleted',item.name,category);
  closeModal();
  render();
  toast(label+' deleted.');
}

  });

      ${selector('Department','course-department-filter',[['','All Departments'],...state.departments.map(x=>[x.id,x.name+(x.isActive?'':' (Inactive)')])],

    <div class="panel">${dateSettingsTable(['Course Code & Title','Department','Academic Units','Lecture / Laboratory Units','Weekly Contact Hours',

function courseUnitSummary(course){
  const [lecture,lab]=teachingActivities(course);
  const total=lecture.hours===null||lab.hours===null?null:lecture.hours+lab.hours;
  const display=hours=>hours===null?'Needs Configuration':hours+' hours';
  return `<strong>Academic Unit Summary</strong>
    <div>Total Academic Units · ${lecture.units+lab.units}</div>
    <div>Weekly ${esc(lecture.category)} Hours · ${display(lecture.hours)}</div>
    <div>Weekly ${esc(lab.category)} Hours · ${display(lab.hours)}</div>
    <div>Total Weekly Contact Hours · ${display(total)}</div>
    ${total===null?'<p class="help">Configure the required conversion in Date &amp; Days before scheduling this course.</p>':''}`;
}

  const status=selector('Status','isActive',[['true','Active'],['false','Inactive']],String(item?.isActive??true));
  const requiredNumber=(label,name,value,opts)=>field(label,name,value??'','number',true,opts);
  let label,fields;
  switch(group){
    case 'shifts':
      label='Shift';
      fields=field('Shift Name','name',item?.name)+field('Start Time','startTime',item?.startTime,'time')+
        field('End Time','endTime',item?.endTime,'time')+status;
      break;
    case 'dayPairs':
      label='Day Pair';
      fields=field('Pair Name','name',item?.name)+selector('First Day','firstDay',weekdays,item?.days[0]??weekdays[0])+
        selector('Second Day','secondDay',weekdays,item?.days[1]??weekdays[1])+status;
      break;

        selector('Sessions Per Week','sessionsPerWeek',weekdays.map((_,index)=>String(index+1)),String(item?.sessionsPerWeek??2))+status;
      break;
    case 'conversions':
      label='Contact-Hour Conversion';
      fields=item?.id==='LAB'?selector('Laboratory Hours Per Unit','hoursPerUnit',[['','Select the approved multiplier'],['2','2 hours'],['3','3 hours']],
        String(item.hoursPerUnit??''),'required'):
        field('Activity Category','category',item?.category,'text',true,item?'readonly':'')+
        requiredNumber('Weekly Contact Hours Per Unit','hoursPerUnit',item?.hoursPerUnit,'min="0" step="any"');
      break;
    case 'week':
      label='Teaching Days';
      fields=`<div class="field full"><div class="pill-row">${weekdays.map(day=>`<label class="checkday">

function ruleOverlap(records,data){
  return records.some(x=>x.id!==data.id&&x.isActive&&recordKey(x.category)===recordKey(data.category)&&
    x.minimumUnits<=data.maximumUnits&&data.minimumUnits<=x.maximumUnits);
}
function updateDateDays(message){
  if(state.schedules.length)state.status='Draft';
  log('Date & Days configuration updated',message,'Date & Days');
}
function saveDateConfig(form,fd){
  const {group,id}=form.dataset,settings=state.dateDays;
  const val=name=>String(fd.get(name)??'').trim();
  const number=name=>Number(val(name));
  if(group==='week'){
    const days=fd.getAll('teachingDay');
    if(!days.length||days.some(x=>!weekdays.includes(x)))return 'Select at least one valid teaching day.';
    settings.teachingDays=weekdays.filter(day=>days.includes(day));
    updateDateDays('Teaching days updated.');
    return '';
  }
  if(group==='increment'){
    const increment=number('increment');
    if(!Number.isInteger(increment)||increment<1||increment>60)return 'Enter a whole-minute increment from 1 to 60.';
    settings.increment=increment;
    updateDateDays('Scheduling increment updated.');
    return '';
  }
  const records=settings[group],old=find(records,id);
  const data={id:old?.id||newRecordId('DATE',records)};
  if(group==='shifts'||group==='dayPairs'){
    data.name=val('name');
    data.isActive=val('isActive')==='true';
    if(!data.name)return 'Enter a name.';
    if(records.some(x=>x.id!==id&&recordKey(x.name)===recordKey(data.name)))return 'This name is already in use.';
    if(group==='shifts'){
      data.startTime=val('startTime');data.endTime=val('endTime');
      if(!validTime(data.startTime)||!validTime(data.endTime)||mins(data.endTime)<=mins(data.startTime)){
        return 'Enter a same-day shift with an end time later than its start time.';
      }
    }else{
      data.days=[val('firstDay'),val('secondDay')];
      if(!data.days.every(x=>weekdays.includes(x))||data.days[0]===data.days[1])return 'Choose two different days.';
      if(records.some(x=>x.id!==id&&data.days.every(day=>x.days.includes(day))))return 'This day combination is already configured.';
    }
  }
  if(group==='rules'){
    Object.assign(data,{category:val('category'),minimumUnits:number('minimumUnits'),maximumUnits:number('maximumUnits'),
      maxDurationMinutes:number('maxDurationMinutes'),sessionsPerWeek:number('sessionsPerWeek'),isActive:val('isActive')==='true'});
    if(!settings.conversions.some(x=>x.category===data.category)||data.minimumUnits<0||!validMaxLoad(data.maximumUnits)||
      data.maximumUnits<data.minimumUnits||!Number.isInteger(data.maxDurationMinutes)||data.maxDurationMinutes<1||
      data.maxDurationMinutes>1439||!Number.isInteger(data.sessionsPerWeek)||data.sessionsPerWeek<1||data.sessionsPerWeek>weekdays.length)return 'Enter a valid category, unit range, session limit, and meeting frequency.';
    if(data.isActive&&ruleOverlap(records,data))return 'Active duration rules for this category cannot have overlapping unit ranges.';
  }
  if(group==='conversions'){
    data.category=old?.category||val('category');
    data.hoursPerUnit=number('hoursPerUnit');
    if(id==='LECTURE'||!data.category||!validMaxLoad(data.hoursPerUnit)||id==='LAB'&&![2,3].includes(data.hoursPerUnit)){
      return 'Enter a valid category and approved contact-hour multiplier.';
    }
    if(records.some(x=>x.id!==id&&recordKey(x.category)===recordKey(data.category)))return 'This activity category already exists.';
  }
  if(old)Object.assign(old,data);
  else records.push(data);

function academicCodeChangeError(record,next,field){
  const affected=state.courseGroups.filter(x=>x[field]===record.id);
  if(!affected.length)return '';
  const overrides=field==='academicProgramId'?{program:next}:{semester:next};
  const groupCodes=new Set(),sectionCodes=new Set(state.sections.filter(section=>!sectionGroup(section)).map(sectionCode));
  const affectedIds=new Set(affected.map(x=>x.id));
  for(const group of state.courseGroups){
    const code=groupCode(group,affectedIds.has(group.id)?overrides:{});
    if(groupCodes.has(code))return 'This change would duplicate a course group code.';
    groupCodes.add(code);
    for(const section of groupSections(group)){
      const display=code+section.sectionLetter;
      if(sectionCodes.has(display))return 'This change would duplicate a section code.';
      sectionCodes.add(display);
    }
  }
  return '';
}

function updateRequiredCourses(form){
  const query=recordKey(form.querySelector('[data-required-search]').value).replace(/\s+/g,'');
  const only=form.querySelector('[data-required-only]').checked;
  let count=0;
  for(const row of form.querySelectorAll('[data-required-row]')){
    const checked=row.querySelector('input').checked;
    if(checked)count++;
    row.classList.toggle('selected',checked);
    row.hidden=only?!checked:!row.dataset.courseSearch.includes(query);
  }

function saveCourseGroup(form,fd){
  const old=find(state.courseGroups,form.dataset.id),identity=groupFormIdentity(form);
  const program=find(state.academicPrograms,identity.academicProgramId),semester=find(state.semesters,identity.semesterId);
  const courses=fd.getAll('requiredCourse');
  const placeholders=(old?.curriculumPlaceholders??[]).filter((item,index)=>{
    const choice=fd.get('curriculum-elective-'+index);
    if(choice)courses.push(choice);
    return !choice;
  });
  if(!program||(!program.isActive&&program.id!==old?.academicProgramId)||!semester||(!semester.isActive&&semester.id!==old?.semesterId)||
    !Number.isSafeInteger(identity.yearLevel)||identity.yearLevel<1)return 'Choose a configured program and semester and enter a positive whole-number year.';
  if((!courses.length&&!placeholders.length)||courses.some(id=>!find(state.courses,id)))return 'Select at least one valid required course.';
  const code=groupCode(identity);
  const duplicate=groupByIdentity(identity);
  if(duplicate&&duplicate.id!==old?.id||state.courseGroups.some(x=>x.id!==old?.id&&groupCode(x)===code))return 'This course group code is already in use.';
  const children=old?groupSections(old):[];
  if(children.some(child=>state.sections.some(x=>x.courseGroupId!==old.id&&sectionCode(x)===code+child.sectionLetter))){
    return 'This change would duplicate a section code.';
  }
  if(children.length&&code!==groupCode(old)&&!fd.has('confirmRename'))return 'Confirm the section code changes.';
  const data={...identity,requiredCourseIds:[...new Set(courses)]};
  if(old){
    if(old.curriculumPlaceholders)data.curriculumPlaceholders=placeholders;
    data.scheduleTemplate=old.scheduleTemplate.filter(x=>data.requiredCourseIds.includes(x.courseId));
    Object.assign(old,data);
    if(children.length)state.status='Draft';
    clearGroupUnresolved(old);
  }else state.courseGroups.push({id:newRecordId('CG',state.courseGroups),...data,scheduleTemplate:[]});
  if(selectedAcademicProgram()?.id!==program.id)selectAcademicProgram(program.id);
  log(old?'Course group updated':'Course group added',code,'Sections');
  return '';
}

function saveTemplate(form,fd){

  if(planned.error)return planned.error;

  group.scheduleTemplate=group.scheduleTemplate.filter(x=>x.courseId!==template.courseId||x.activity!==template.activity);
  group.scheduleTemplate.push(template);
  state.schedules=review.working;

function assignmentCards(tasks,working,issues){
  const published=activeMeetings(state.publishedSchedules??[]);
  return tasks.map(task=>{
    const course=find(state.courses,task.courseId);
    const requirement=teachingActivities(course).find(x=>x.id===task.activity);
    const meetings=working.filter(x=>matchesActivity(x,task));
    // A legacy meeting did not distinguish activities. Attach it to the first activity for review.
    const firstActivity=teachingActivities(course).find(x=>x.units>0)?.id??null;
    if(!meetings.length&&task.activity===firstActivity){
      meetings.push(...working.filter(x=>!x.groupId&&!x.activity&&sameOffering(x,task)));
    }
    const entry=meetings[0],draft=assignmentDraft(task);
    const activityIssues=issues.filter(x=>matchesActivity(x,task)||x.id&&meetings.some(meeting=>meeting.id===x.id));
    const conflict=activityIssues.find(x=>x.kind==='Conflict');
    const partial=draft||activityIssues.some(x=>x.kind==='Partial');
    const status=conflict?'Conflict':partial?'Partially Assigned':!entry?'Unassigned':
      meetings.every(x=>confirmedMeeting(x,published))?'Published':'Scheduled';
    return {task,requirement,meetings,entry,draft,status,conflict};
  }).sort((a,b)=>['Unassigned','Partially Assigned','Conflict','Scheduled','Published'].indexOf(a.status)-
    ['Unassigned','Partially Assigned','Conflict','Scheduled','Published'].indexOf(b.status));
}

function courseAssignmentCards(activities,weekly){

  }

async function parseProspectusWorkbook(file){
  if(!/\.xlsx?$/i.test(file.name))throw Error('Choose an .xlsx or .xls workbook.');
  if(!window.XLSX)throw Error('Excel support is unavailable. Connect to the internet or use the demo prospectus.');
  const workbook=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const courses=[],notes=[],unreadable=[],headings=[...workbook.SheetNames];
  const yearWords=['first','second','third','fourth','fifth','sixth'];
  const period=(text,kind)=>{
    const match=text.match(new RegExp('\\b(first|second|third|fourth|fifth|sixth|[1-9]\\d*(?:st|nd|rd|th)?)\\s*'+kind+'\\b','i'))??
      text.match(new RegExp('\\b'+kind+'\\s+([1-9]\\d*)\\b','i'));
    return match?parseInt(match[1],10)||yearWords.indexOf(match[1].toLowerCase())+1:0;
  };
  for(const sheet of workbook.SheetNames){
    const rows=XLSX.utils.sheet_to_json(workbook.Sheets[sheet],{header:1,raw:false,defval:''});
    let yearLevel=period(sheet,'year'),semester=period(sheet,'semester'),headers=[];
    for(const [index,cells] of rows.entries()){
      const values=cells.map(cell=>String(cell??'').trim());
      const text=values.filter(Boolean).join(' ');
      if(!text)continue;
      const labels=values.map(value=>value.toLowerCase().replace(/[^a-z]/g,''));
      if(labels.some(label=>['coursetitle','coursename','subjecttitle','subjectname','title'].includes(label))){
        headers=labels;
        continue;
      }
      const read=pattern=>values[headers.findIndex(label=>pattern.test(label))]??'';
      const courseName=read(/^(?:course|subject)?(?:title|name)$|^description$/);
      const codePrefix=read(/^(?:course|subject)?(?:prefix|letters)$/);
      const codeNumber=read(/^(?:course|subject|numeric)?(?:number|code)$/);
      const rawCode=read(/^(?:course|subject)?code$/)||[codePrefix,codeNumber].filter(Boolean).join(' ');
      const beginsPeriod=/^(?:(?:first|second|third|fourth|fifth|sixth|\d+(?:st|nd|rd|th)?)\s+(?:year|semester)|(?:year|semester)\s+\d+)/i.test(text);
      if(beginsPeriod&&(!courseName||(!rawCode&&/^(?:first|second|third|fourth|fifth|sixth|\d+)\w*\s+(?:year|semester)/i.test(courseName)))){
        const newYear=period(text,'year');
        const newSemester=period(text,'semester');
        if(newYear&&newYear!==yearLevel&&!newSemester)semester=0;
        yearLevel=newYear||yearLevel;
        semester=newSemester||semester;
        continue;
      }
      if(!headers.length||/^(?:bachelor\b|aclc\b|(?:effective|curriculum)\b|(?:sub\s*)?total\b)/i.test(text)){
        headings.push(text);
        continue;
      }
      if(/life[\s-]*long\s+life[\s-]*wide|\b3LP\b/i.test(text)){
        notes.push({yearLevel,semester,text});
        continue;
      }
      if(!courseName||!yearLevel||!semester){
        unreadable.push(sheet+' · row '+(index+1));
        continue;
      }
      const sourceUnits=read(/^(?:total)?(?:academic)?units?$|^total$/);
      courses.push({courseCode:rawCode,courseName,yearLevel,semester,sourceUnits,
        lectureUnits:read(/^(?:lec|lecture)(?:units?)?$/),laboratoryUnits:read(/^(?:lab|laboratory)(?:units?)?$/),
        departmentLabel:read(/^(?:course)?department(?:code|name)?$/),
        prerequisites:prospectusPrerequisites(read(/^pre(?:requisites?|reqs?)$/)),
        elective:!rawCode&&/\belective\b/i.test(courseName)});
    }
  }
  const programText=headings.join(' ');
  const effectiveYear=programText.match(/\b(?:effective(?:\s+s\.?y\.?)?|s\.?y\.?|school\s+year|academic\s+year)\s*[:(]?\s*(\d{4})\s*[-–—/]\s*(\d{4})/i);
  return {filename:file.name,source:'Excel upload',courses,notes,unreadable,programText,
    effectiveYear:effectiveYear?effectiveYear[1]+'–'+effectiveYear[2]:''};
}

function newProspectusDraft(prospectus){

      if(!demoCodes.has(row.courseCode))demoCodes.set(row.courseCode,new Set());
      demoCodes.get(row.courseCode).add(recordKey(row.courseName));
    }
  }
  const ambiguousCode=code=>(demoCodes.get(code)?.size??0)>1;
  const usedCodes=new Set([...state.courses.map(courseCode),...prospectus.courses.map(source=>normalizeCourseCode(source.courseCode)).filter(Boolean)]);
  let provisional=1;
  const nextAutoCode=()=>{
    let code;
    do{code='AUTO'+String(provisional++).padStart(4,'0')}while(usedCodes.has(code));
    usedCodes.add(code);
    return code;
  };
  const rows=prospectus.courses.map((source,index)=>{
    const sourceCode=normalizeCourseCode(source.courseCode);
    const needsConfirmedCode=ambiguousCode(sourceCode);
    const heldPrerequisites=prospectus.isDemo?source.prerequisites.filter(value=>
      normalizeCourseCode(value)===sourceCode||ambiguousCode(normalizeCourseCode(value))):[];
    const prerequisites=source.prerequisites.filter(value=>!heldPrerequisites.includes(value));
    const notes=[source.note,heldPrerequisites.length?

    const autoGenerated=!sourceCode&&!needsConfirmedCode&&!source.elective;
    return {...source,index,code:autoGenerated?nextAutoCode():needsConfirmedCode?'':sourceCode,autoGenerated,needsConfirmedCode,
      lecture:source.lectureUnits,lab:source.laboratoryUnits,prerequisites,prerequisiteText:prerequisites.join(', '),
      departmentId:prospectusDepartment(source.departmentLabel)||( /^(?:CS|ITE|IT)/i.test(sourceCode)?find(state.departments,'DEP-CS')?.id:find(state.departments,'DEP-GE')?.id),note:notes.join(' '),excluded:false,useExisting:false};
  });
  const groups=new Map();
  for(const row of rows){
    const key=row.yearLevel+'-'+row.semester;
    if(!groups.has(key))groups.set(key,{key,yearLevel:row.yearLevel,semesterOrder:row.semester,rows:[],count:'1',include:true});
    groups.get(key).rows.push(row);
  }
  return {prospectus,rows,groups:[...groups.values()].sort((a,b)=>a.yearLevel-b.yearLevel||a.semesterOrder-b.semesterOrder),
    programId:prospectusProgram(prospectus)};
}

      if(occupiedGroups.has(code)||proposedGroups.has(code))errors.push('This course group code is already in use.');
      proposedGroups.add(code);
      if(sections.some(section=>occupiedSections.has(section)||proposedSections.has(section)))errors.push('A proposed section code is already in use.');
      for(const section of sections)proposedSections.add(section);
    }
    return {...group,...identity,code,existing,included,sections,errors,semester};
  });
  const selectedGroups=groups.filter(group=>group.included);
  const selectedRows=new Set(selectedGroups.flatMap(group=>group.rows));
  const sourceDefinitions=new Map();
  const sourceDepartments=new Map();
  const originalTitles=new Map();
  for(const row of draft.rows){
    const code=normalizeCourseCode(row.courseCode);
    if(!originalTitles.has(code))originalTitles.set(code,new Set());
    originalTitles.get(code).add(recordKey(row.courseName));
  }
  const catalog=new Map(state.courses.map(course=>[courseCode(course),course]));
  const rows=draft.rows.map(row=>{
    const code=normalizeCourseCode(row.code);
    const lecture=prospectusInteger(row.lecture),lab=prospectusInteger(row.lab);
    const sourceUnits=prospectusUnit(row.sourceUnits);
    const units=lecture!==null&&lab!==null?lecture+lab:null;
    const parentheticalUnits=/^\(/.test(String(row.sourceUnits??'').trim());
    const active=selectedRows.has(row)&&!row.excluded;
    const placeholder=(row.elective||row.needsConfirmedCode)&&!code;
    const existing=catalog.get(code);
    const definition=prospectusDefinition(row.courseName,lecture,lab,units,parentheticalUnits,row.prerequisites);
    const existingDefinition=existing&&prospectusDefinition(existing.title,existing.lecture,existing.lab,
      existing.units??existing.lecture+existing.lab,existing.parentheticalUnits,existing.prerequisites??[]);
    const reuse=Boolean(existing&&(definition===existingDefinition||row.useExisting));
    const catalogDepartment=reuse?find(state.departments,existing.departmentId):null;
    const department=catalogDepartment??find(state.departments,row.departmentId);
    const sourceMismatch=sourceUnits!==null&&units!==null&&!parentheticalUnits&&sourceUnits!==units;
    const invalidUnits=lecture===null||lab===null||units===null||units<=0;
    const result={row,code,lecture,lab,units,parentheticalUnits,sourceMismatch,active,placeholder,existing,reuse,department,catalogDepartment,invalidUnits};
    if(active&&code&&department){
      if(!sourceDepartments.has(code))sourceDepartments.set(code,new Set());
      sourceDepartments.get(code).add(department.id);
    }
    if(active&&code&&!reuse){
      if(!sourceDefinitions.has(code))sourceDefinitions.set(code,new Set());
      sourceDefinitions.get(code).add(definition);
    }
    return result;
  });
  for(const item of rows){
    const {row,code,existing,reuse,department,invalidUnits,placeholder}=item;
    item.duplicate=(sourceDefinitions.get(code)?.size??0)>1||Boolean(existing&&!reuse);
    item.warnings=[];
    if(row.note&&!draft.prospectus.isDemo)item.warnings.push(row.note);
    if(row.prerequisites.some(value=>normalizeCourseCode(value)===code&&code))item.warnings.push('The source lists this course as its own prerequisite.');
    if(row.prerequisites.some(value=>(originalTitles.get(normalizeCourseCode(value))?.size??0)>1||
      (sourceDefinitions.get(normalizeCourseCode(value))?.size??0)>1))
      item.warnings.push('A prerequisite refers to a conflicting source course code.');
    item.errors=[];
    if(!placeholder){
      if(!/^[A-Z]+\d+[A-Z]*$/.test(code))item.errors.push('Enter a valid course code.');
      if(item.duplicate)item.errors.push(existing?'Conflicting catalog definition.':'Duplicate course code with different source details.');
      if((sourceDepartments.get(code)?.size??0)>1)item.errors.push('Choose the same department for repeated copies of this course.');
      if(item.sourceMismatch)item.warnings.push(`Source academic units ${prospectusUnit(row.sourceUnits)} differ from calculated total ${item.units}.`);
      if(invalidUnits&&!reuse)item.errors.push('Review the lecture, lab, and total units.');
    }
  }
  for(const group of selectedGroups){
    if(!rows.some(item=>item.active&&group.rows.includes(item.row)))group.errors.push('Include at least one subject or elective.');
  }
  return {program,groups,selectedGroups,rows,canSave:Boolean(selectedGroups.length)&&
    selectedGroups.every(group=>!group.errors.length)&&rows.every(item=>!item.active||!item.errors.length)};
}

function prospectusRow(item,groups,isDemo){

    ${type==='number'?'inputmode="numeric" pattern="[0-9]*" min="0" step="1"':''} ${disabled?'disabled':''}>`;

    <td>${esc(row.courseName)}${reuse&&existing.title!==row.courseName?`<div class="ghost-text">Catalog · ${esc(existing.title)}</div>`:''}</td>
    <td>${input('lecture',reuse?existing.lecture:row.lecture,'Lecture units','number',!inputs||reuse)}</td>
    <td>${input('lab',reuse?existing.lab:row.lab,'Laboratory units','number',!inputs||reuse)}</td>

function updateProspectusControl(control){
  if(!blockImportDraft||!control.closest('#block-import-body'))return;
  if(control.id==='f-block-import-program')blockImportDraft.programId=control.value;
  else if(control.hasAttribute('data-prospectus-row')){
    const row=blockImportDraft.rows[Number(control.dataset.prospectusRow)],field=control.dataset.field;
    if(field==='lecture'||field==='lab'){
      if(control.value!==''&&!/^[0-9]+$/.test(control.value)){
        control.value=blockImportDraft.rows[Number(control.dataset.prospectusRow)][field]??'';
        return;
      }
    }
    if(field==='prerequisites'){
      row.prerequisiteText=control.value;
      row.prerequisites=prospectusPrerequisites(control.value);
    }else row[field]=control.type==='checkbox'?control.checked:control.value;
    if(field==='code')row.useExisting=false;
  }else if(control.hasAttribute('data-prospectus-group')){
    const group=blockImportDraft.groups.find(item=>item.key===control.dataset.prospectusGroup);
    group[control.dataset.field]=control.type==='checkbox'?control.checked:control.value;
  }else return;
  renderProspectusPreview();
}
function confirmBlockImport(){
  const draft=blockImportDraft;
  if(!draft)return;
  const validation=validateProspectus(draft);
  const feedback=document.querySelector('[data-prospectus-error]');
  if(!validation.canSave){
    feedback.textContent='Resolve or exclude the highlighted rows and review the selected course groups.';
    return;
  }
  const {program,selectedGroups,rows}=validation;
  const courses=[...state.courses],courseGroups=[...state.courseGroups],sections=[...state.sections];
  const imports=[...(state.courseGroupImports??[])];
  const id=newRecordId('CURRICULUM',imports);
  const catalog=new Map(courses.map(course=>[courseCode(course),course.id]));
  const courseIds=new Map();
  for(const item of rows.filter(item=>item.active&&!item.placeholder)){
    const {row,code,lecture,lab,units,parentheticalUnits,department}=item;
    if(!catalog.has(code)){
      const courseId=find(courses,code)?newRecordId('COURSE',courses):code;
      courses.push({id:courseId,courseCode:code,title:row.courseName,lecture,lab,units,
        sourceUnits:String(row.sourceUnits??'').trim()||String(units),parentheticalUnits,departmentId:department?.id||find(state.departments,'DEP-CS')?.id,
        prerequisites:[...row.prerequisites],roomType:lab?'Computer Lab':'Lecture',curriculumSourceNote:row.note||''});
      catalog.set(code,courseId);
    }
    if(item.reuse&&!item.catalogDepartment){
      const index=courses.findIndex(course=>course.id===item.existing.id);
      courses[index]={...courses[index],departmentId:department.id};
    }
    courseIds.set(row.index,catalog.get(code));
  }
  const imported=[];
  for(const group of selectedGroups){
    const included=rows.filter(item=>item.active&&group.rows.includes(item.row));
    const record={id:newRecordId('CG',courseGroups),academicProgramId:program.id,yearLevel:group.yearLevel,
      semesterId:group.semesterId,curriculumId:id,requiredCourseIds:[...new Set(included
        .filter(item=>!item.placeholder).map(({row})=>courseIds.get(row.index)))],scheduleTemplate:[],
      curriculumPlaceholders:included.filter(item=>item.placeholder).map(({row,lecture,lab,units,parentheticalUnits})=>({
        title:row.courseName,sourceCode:row.courseCode,lecture,lab,units,parentheticalUnits,sourceUnits:row.sourceUnits,
        prerequisites:[...row.prerequisites],sourceNote:row.note||''
      })),
      curriculumNotes:draft.prospectus.notes.filter(note=>note.yearLevel===group.yearLevel&&note.semester===group.semesterOrder)
        .map(note=>note.text)};
    courseGroups.push(record);
    imported.push(record);
    for(let index=0;index<group.sections.length;index++){
      const section={id:newRecordId('SEC',sections)};
      linkSection(section,record,index+1);
      sections.push(section);
    }
  }
  imports.push({id,academicProgramId:program.id,courseGroupIds:imported.map(group=>group.id),prospectus:draft.prospectus,
    importedAt:new Date().toISOString()});
  const error=saveCurriculumChange({courses,courseGroups,sections,courseGroupImports:imports},
    'Curriculum imported',program.code+' · '+imported.length+' course groups · '+(sections.length-state.sections.length)+' sections');
  if(error){feedback.textContent=error;return}
  blockImportDraft=null;
  closeModal();
  programSearch='';
  selectAcademicProgram(program.id);
  for(const group of imported)expandedGroups.set(group.id,true);
  programBlocksTab='programs';
  navigate('program-blocks');
  toast('Imported '+imported.length+' course groups.');
}

function saveCourse(form,fd){

  const code=normalizeCourseCode(fd.get('id')),title=String(fd.get('title')||'').trim();
  const lecture=Number(fd.get('lecture')),lab=Number(fd.get('lab')),units=lecture+lab;
  const departmentId=fd.get('departmentId'),department=find(state.departments,departmentId);
  if((!code&&!old?.isUncoded)||!title)return 'Enter a course code and title.';
  if(!department||(!department.isActive&&old?.departmentId!==departmentId))return 'Select an active department.';
  if(!Number.isFinite(units)||lecture<0||lab<0||units<=0)return 'Enter nonnegative lecture and laboratory units with a positive total.';
  if(code&&state.courses.some(c=>c.id!==id&&courseCode(c)===code))return 'This course code already exists.';
  if(id&&!old)return 'The course could not be found.';
  const enteredPrerequisites=String(fd.get('prerequisites')??'').trim();
  const prerequisites=enteredPrerequisites===(old?.prerequisites??[]).join(', ')?(old?.prerequisites??[]):
    [...new Set(enteredPrerequisites.split(',').map(normalizeCourseCode).filter(Boolean))];
  const course={
    id:old?.id||(find(state.courses,code)?newRecordId('COURSE',state.courses):code),
    courseCode:code,title,departmentId,lecture,lab,units,roomType:old?.roomType||(lab>0?'Computer Lab':'Lecture'),
    isUncoded:!code,prerequisites
  };
  if(old){
    const previousCode=courseCode(old);
    Object.assign(old,course);
    if(previousCode&&previousCode!==code){
      for(const record of state.courses){
        record.prerequisites=record.prerequisites?.map(value=>normalizeCourseCode(value)===previousCode?code:value)??[];
      }
    }
  }else state.courses.push(course);
  log(old?'Course updated':'Course created',`${code} — ${title}`,'Catalog');
  return '';
}

function saveAssignment(form){
  const plans=readAssignmentPlans(form),previous=previousCourseMeetings(form);
  if(!plans.length)return assignmentUnitsError(findCourse(assignmentCourse(form).courseId));
  const others=state.schedules.filter(x=>!previous.includes(x)),working=activeMeetings(others);
  const reservations=draftRoomReservations().filter(x=>!sameOffering(x,plans[0]));
  const saved=[];
  for(const [index,plan] of plans.entries()){
    const planned=planMeetings(plan),errors=validatePlan(plan,planned,working,undefined,true,reservations);
    if(errors.length)return errors.join(' ');
    const replacements=previous.filter(x=>x.activity===plan.activity||index===0&&!x.groupId);
    const meetings=saveMeetings(plan,planned,replacements,[...state.schedules,...saved]);
    working.push(...meetings);
    saved.push(...meetings);
  }
  state.schedules=[...others,...saved];
  clearCourseDrafts(plans[0]);
  state.unresolved=(state.unresolved??[]).filter(task=>!sameOffering(plans[0],task));
  state.status='Draft';
  log(previous.length?'Course schedule updated':'Course schedule added',courseLabel(plans[0].courseId),'Schedule');
  return '';
}

function saveAssignmentDraft(form){
  const plans=readAssignmentPlans(form),offering=assignmentCourse(form);
  if(!plans.length){
    editorError(form,assignmentUnitsError(findCourse(offering.courseId)));return;
  }
  if(!reqs().some(task=>sameOffering(task,offering))){
    editorError(form,'Select a required course for this section before saving a draft.');return;
  }
  const previous=previousCourseMeetings(form),proposed=[];
  for(const plan of plans){
    if(!plan.roomId||!plan.start)continue;
    const planned=planMeetings(plan);
    if(planned.error){editorError(form,planned.error);return}
    const room=find(state.rooms,plan.roomId);
    if(!room||!roomMatches(room,planned.requirement)){
      editorError(form,'Select an active classroom with the required '+planned.requirement.facility+' facility type.');return;
    }
    const reservations=roomReservations(plan.roomId).filter(x=>!previous.includes(x)&&
      (!x.draftReservation||!sameOffering(x,offering)));
    for(const meeting of planned.meetings){
      const occurrence={...plan,...meeting};
      const conflicts=roomConflicts(occurrence,[...reservations,...proposed]);
      if(conflicts.length){editorError(form,[...new Set(conflicts.map(roomConflictMessage))].join(' '));return}
      proposed.push(occurrence);
    }
  }
  clearCourseDrafts(offering);
  state.assignmentDrafts.push(...plans);
  state.status='Draft';
  log('Course schedule draft saved',courseLabel(offering.courseId),'Schedule');
  closeModal();render();toast('Course schedule draft saved.');
}

 else if(type==='semester'){const name=val('name').replace(/\s+/g,' '),order=num('order'),error=document.getElementById('semester-errors');if(!name||!Number.isInteger(order)||order<1){error.innerHTML='<div class="alert red" style="margin-top:15px">Enter a semester name and a positive whole-number order.</div>';return}if(state.semesters.some(x=>x.id!==id&&x.name.trim().toLowerCase()===name.toLowerCase())){error.innerHTML='<div class="alert red" style="margin-top:15px">That semester name already exists.</div>';return}if(state.semesters.some(x=>x.id!==id&&x.order===order)){error.innerHTML='<div class="alert red" style="margin-top:15px">That semester order already exists.</div>';return}const old=id?find(state.semesters,id):null;const data={id:id||'SEM'+Date.now(),name,order,isActive:val('isActive')==='true'};if(old){const conflict=academicCodeChangeError(old,data,'semesterId');if(conflict){error.textContent=conflict;return}Object.assign(old,data)}else state.semesters.push(data);log(`Semester ${old?'updated':'added'}`,name,'Academic Configuration')}
 else if(type==='location'){const name=val('name').replace(/\s+/g,' ');if(!name){document.getElementById('location-errors').innerHTML='<div class="alert red" style="margin-top:15px">Building / Location Name is required.</div>';return}if(state.locations.some(x=>x.id!==id&&x.name.trim().toLowerCase()===name.toLowerCase())){document.getElementById('location-errors').innerHTML='<div class="alert red" style="margin-top:15px">A building or location with this name already exists.</div>';return}const data={id:id||'LOC'+Date.now(),name,description:val('description'),isActive:val('isActive')==='true'};if(id){const old=find(state.locations,id);Object.assign(old,data);log('Building / location updated',`${name} is now ${data.isActive?'active':'inactive'}`,'Locations')}else{state.locations.push(data);log('Building / location added',name,'Locations')}}

 else if(type==='room'){const locationId=val('buildingLocationId'),facilityTypeId=val('facilityTypeId'),facility=find(state.facilityTypes,facilityTypeId);if(!locationId||!find(state.locations,locationId)){toast('Select a configured building or location.',true);return}if(!facilityTypeId||!facility){toast('Select a configured facility type.',true);return}const r={id:val('id').toUpperCase(),name:val('name'),type:facility.legacyType||facility.name,facilityTypeId,capacity:num('capacity'),buildingLocationId:locationId};if(!id&&find(state.rooms,r.id)){toast('Room code already exists.',true);return}if(id){const old=find(state.rooms,id);const before=`${old.type}, ${old.capacity} seats`;Object.assign(old,r);log('Classroom updated',`${r.id}: ${before} → ${facility.name}, ${r.capacity} seats`,'Rooms')}else{state.rooms.push(r);log('Classroom added',r.name,'Rooms')}}

 if(['course','room','location','facility-type','academic-program','semester'].includes(type))state.status='Draft';

function csvDownload(rows,filename){if(!rows.length){toast('There is no data to export.',true);return}const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportSchedules(){csvDownload([['Section','Course','Course Title','Activity','Shift','Day Pair','Duration (minutes)','Professor','Room','Day','Start','End','Status'],...activeMeetings().map(x=>[sectionCode(find(state.sections,x.sectionId)),courseCode(find(state.courses,x.courseId))||x.courseId,find(state.courses,x.courseId)?.title,activityName(x),find(state.dateDays.shifts,x.shiftId)?.name,find(state.dateDays.dayPairs,x.pairId)?.name,x.durationMinutes,facultyName(x.facultyId),x.roomId,x.day,x.start,endTime(x),state.status])],'SchedMatrix_Timetable.csv')}
function exportLogs(){csvDownload([['Action','Details','Type','User','Timestamp'],...state.logs.map(x=>[x.action,x.details,x.type,x.user,x.at])],'SchedMatrix_Audit_Trail.csv')}
function publish(){const issues=detectIssues();if(issues.length||!activeMeetings().length){toast(`Cannot publish: ${issues.length} issues remain.`,true);return}state.publishedSchedules=[...state.publishedSchedules.filter(x=>!sameTerm(meetingTerm(x),activeTerm())),...structuredClone(activeMeetings())];state.version+=1;state.publishedAt=new Date().toISOString();state.status='Published';log('Schedule published',`Revision ${state.version}: ${activeMeetings().length} validated assignments approved and published.`,'Approval');render();toast('Timetable published as revision '+state.version+'.')}

function printSchedule(){const rows=activeMeetings().map(x=>`<tr><td>${esc(sectionCode(find(state.sections,x.sectionId)))}</td><td>${esc(courseCode(find(state.courses,x.courseId))||x.courseId)} — ${esc(find(state.courses,x.courseId)?.title)}<br>${esc(activityName(x))}</td><td>${esc(facultyName(x.facultyId))}</td><td>${esc(x.roomId)}</td><td>${esc(x.day)} ${timeRange(x)}</td></tr>`).join('');const html=`<!doctype html><html><head><title>SchedMatrix Timetable</title><style>body{font:12px Arial;padding:32px;color:#13243d}h1{font-size:22px}p{color:#667}table{border-collapse:collapse;width:100%;margin-top:20px}th,td{border:1px solid #ccc;padding:9px;text-align:left}th{background:#eff4fa}@media print{body{padding:8px}}</style></head><body><h1>SchedMatrix · Academic Timetable</h1><p>${esc(termLabel())} · ${esc(state.status)} · Revision ${state.version}</p><table><thead><tr><th>Block</th><th>Course</th><th>Professor</th><th>Room</th><th>Meeting</th></tr></thead><tbody>${rows}</tbody></table><script>window.onload=()=>window.print()<\/script></body></html>`;const w=window.open('','_blank');if(!w){toast('Allow pop-ups to print or save as PDF.',true);return}w.document.write(html);w.document.close()}
function runAction(action,node){const id=node.dataset.id;switch(action){case 'toggle-menu':document.getElementById('sidebar').classList.toggle('open');document.getElementById('scrim').classList.toggle('open');break;case 'close-modal':closeModal();break;case 'delete-configuration':deleteConfiguration(node.dataset.group,id);break;case 'confirm-delete-configuration':deleteConfiguration(node.dataset.group,id,true);break;case 'reset-curriculum':resetCurriculum();break;case 'confirm-reset-curriculum':resetCurriculum(true,node.hasAttribute('data-open-import'));break;case 'keep-curriculum-import':importBlocksModal();break;case 'load-demo-prospectus':blockImportDraft=newProspectusDraft(prospectusDemo());renderProspectusPreview();break;case 'add-location':locationModal();break;case 'edit-location':locationModal(id);break;case 'toggle-location':{const x=find(state.locations,id);if(x){x.isActive=!x.isActive;save();render();toast(`${x.name} ${x.isActive?'activated':'deactivated'}.`) }break}case 'add-faculty':facultyModal();break;case 'edit-faculty':facultyModal(id);break;case 'faculty-timetable':openTimetable('faculty',id,node);break;case 'room-timetable':openTimetable('room',id,node);break;case 'assignment-timetable':{const form=node.closest('form');openTimetable('faculty',id||[...form.querySelectorAll('[name="facultyId"]')].find(x=>x.value)?.value,node,form);break}case 'assignment-room-timetable':{const form=node.closest('form');openTimetable('room',meetingControls(node.closest('[data-component]')).roomId.value,node,form);break}case 'timetable-meeting':timetableMeetingDetails(node.dataset.meetingKey);break;case 'add-course':courseModal();break;case 'edit-course':courseModal(id);break;case 'add-course-group':courseGroupModal();break;case 'select-academic-program':selectAcademicProgram(id);render();document.querySelector('[data-action="select-academic-program"][aria-pressed="true"]')?.focus();break;case 'clear-group-filters':clearGroupFilters();render();break;case 'add-program-for-import':academicProgramModal(null,blockImportDraft);break;case 'edit-course-group':courseGroupModal(id);break;case 'toggle-course-group':{const isOpen=expandedGroups.get(id)??Boolean(searchTerm.trim());expandedGroups.set(id,!isOpen);render();break}case 'add-section':addSectionModal(id);break;case 'open-section-schedule':openSectionSchedule(id);break;case 'manage-template':templateModal(id);break;case 'edit-template':editTemplateModal(id,node.dataset.course,node.dataset.activity);break;case 'clear-template':clearTemplate(id,node.dataset.course,node.dataset.activity);break;case 'confirm-clear-template':confirmClearTemplate(id,node.dataset.course,node.dataset.activity);break;case 'edit-section':sectionModal(id);break;case 'add-room':roomModal();break;case 'edit-room':roomModal(id);break;case 'manage-faculty-courses':manageFacultyCourses(id);break;case 'faculty-course-details':facultyCourseDetails(id,node.dataset.course);break;case 'save-course-matches':saveCourseMatches();break;case 'select-professor':openProfessorPicker(node);break;case 'confirm-professor':confirmProfessor(id);break;case 'back-to-assignment':backToAssignment();break;case 'change-professor-department':document.getElementById('f-professor-department').focus();break;case 'professor-timetable':openTimetable('faculty',id,node,null,true);break;case 'go-to-course-matching':document.getElementById('modal-root').replaceChildren();navigate('ranking');break;case 'return-to-professors':navigate('scheduler');renderProfessorPicker();break;case 'add-faculty-config':facultyConfigModal(node.dataset.group);break;case 'edit-faculty-config':facultyConfigModal(node.dataset.group,id);break;case 'toggle-faculty-config':{const item=find(state[node.dataset.group],id);if(item){item.isActive=!item.isActive;log(facultyConfigLabels[node.dataset.group]+(item.isActive?' activated':' deactivated'),item.name,node.dataset.group==='departments'?'Academic Configuration':'Faculty Configuration');render();toast(item.name+(item.isActive?' activated.':' deactivated.'))}break}case 'date-config':dateConfigModal(node.dataset.group,id);break;case 'toggle-date-config':toggleDateConfig(node.dataset.group,id);break;case 'generate':generateConfirm();break;case 'confirm-generate':{const result=scheduleGenerate();closeModal();render();toast(`Added ${result.assigned} weekly activities; ${result.unassigned} unresolved.`);break}case 'add-assignment':assignmentModal();break;case 'edit-assignment':assignmentModal(id);break;case 'resolve':{assignmentModal(id||null,node.dataset.section,node.dataset.course,node.dataset.activity);break}case 'remove-assignment':removeAssignment();break;case 'save-assignment-draft':saveAssignmentDraft(document.getElementById('editor'));break;case 'save-modal':modalSubmit();break;case 'calendar-mode':scheduleMode='calendar';render();break;case 'table-mode':scheduleMode='table';render();break;case 'validate':render();toast(detectIssues().length?`${detectIssues().length} issue(s) found.`:'All assignments passed validation.');break;case 'publish':publish();break;case 'export':exportSchedules();break;case 'export-logs':exportLogs();break;case 'print':printSchedule();break;case 'scheduler':navigate('scheduler');break;case 'approvals':navigate('approvals');break;default:break}}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();closeMenu();return}
  if(e.key!=='Tab'||!timetableContext)return;
  const dialog=document.querySelector('#modal-root .dialog');
  const controls=[...dialog.querySelectorAll('button:not(:disabled),[tabindex="0"]')];
  const first=controls[0],last=controls.at(-1);
  if(e.shiftKey&&(document.activeElement===first||document.activeElement===dialog)){
    e.preventDefault();last?.focus();
  }else if(!e.shiftKey&&document.activeElement===last){
    e.preventDefault();first?.focus();
  }
});

      control.setSelectionRange(position,position);
    }

    if(control.matches('[data-required-search]'))updateRequiredCourses(form);

  }

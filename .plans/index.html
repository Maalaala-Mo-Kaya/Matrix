function migrateFacultyCatalogEntry(records,prefix,name){
  if(!name)return null;
  const existing=records.find(x=>recordKey(x.name)===recordKey(name));
  if(existing)return existing;
  const id=newRecordId(prefix,records);
  const base=name.toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'')||prefix;
  let code=base;
  for(let suffix=2;records.some(x=>recordKey(x.code)===recordKey(code));suffix++)code=base+'-'+suffix;
  const entry={id,code,name,description:'Migrated from an existing faculty record',isActive:true};
  records.push(entry);
  return entry;
}

function specializationSelectable(item){

function courseSpecializationError(mainId,relatedIds,previous=null){
  const main=find(state.specializations,mainId);
  if(mainId&&(!main||(!specializationSelectable(main)&&mainId!==previous?.mainId))){
    return 'Select an active main specialization from an active department.';
  }
  if(new Set(relatedIds).size!==relatedIds.length)return 'Related specializations must be unique.';
  if(mainId&&relatedIds.includes(mainId))return 'The main specialization cannot also be selected as related.';
  if(relatedIds.some(id=>{
    const item=find(state.specializations,id);
    return !item||(!specializationSelectable(item)&&!previous?.relatedIds?.includes(id));
  }))return 'Select active related specializations from active departments.';
  return '';
}
function rankFaculty(courseId){
  const course=find(state.courses,courseId),config=course?.specializationConfig;
  const mainId=config?.mainId||null,relatedIds=config?.relatedIds??[];
  if(!mainId&&!relatedIds.length)return {mode:'No Specialization Criteria',error:noSpecializationCriteria};
  const error=courseSpecializationError(mainId,relatedIds,config);
  if(error)return {error:'Ranking unavailable. '+error};
  const results=state.faculty.map(faculty=>{
    const verified=new Set(faculty.specializationAssociations.filter(x=>x.status==='verified').map(x=>x.specializationId));
    const M=Number(Boolean(mainId)&&verified.has(mainId));
    const matched=relatedIds.filter(id=>verified.has(id));
    const missing=relatedIds.filter(id=>!verified.has(id));
    const N=relatedIds.length,R=matched.length;
    const mainScore=config.mainWeight*M,relatedScore=N?config.relatedWeight*R/N:0;
    return {courseId,facultyId:faculty.id,eligible:Boolean(M),M,N,R,matched,missing,mainScore,relatedScore,
      finalScore:mainScore+relatedScore,policyVersion:config.version};
  }).sort((a,b)=>b.finalScore-a.finalScore);
  function withRanks(rows){
    let rank=0;
    return rows.map((row,index)=>{
      if(row.finalScore!==rows[index-1]?.finalScore)rank=index+1;
      return {...row,rank};
    });
  }
  const primary=withRanks(results.filter(x=>x.eligible));
  const mode=mainId?(primary.length?'SPWMA Primary and Fallback':'SPWMA Fallback Only'):'Related-Specialization Recommendations';
  const maximum=config.relatedWeight+(mainId?config.mainWeight:0);
  return {course,config,mode,maximum,primary,
    fallback:mainId?withRanks(results.filter(x=>!x.eligible)):[],relatedOnly:mainId?[]:withRanks(results)};
}
function validMaxLoad(value){return Number.isFinite(value)&&value>0}
function facultyLoad(facultyId,employmentTypeId,proposed=null){
  const employment=find(state.employmentTypes,employmentTypeId);
  const maximum=validMaxLoad(employment?.maxLoad)?employment.maxLoad:null;
  const confirmed=state.publishedSchedules??[];
  const assignments=facultyId?confirmed.filter(x=>x.facultyId===facultyId):[];
  // The prototype has one active timetable. Only confirmed, explicit load units are usable.
  const missingConfirmedTimetable=Boolean(facultyId&&!state.version);
  const assigned=missingConfirmedTimetable||assignments.some(x=>!Number.isFinite(x.teachingLoadUnits)||x.teachingLoadUnits<0)
    ?null:assignments.reduce((sum,x)=>sum+x.teachingLoadUnits,0);
  const remaining=maximum===null||assigned===null?null:maximum-assigned;
  const tolerance=Number.EPSILON*Math.max(maximum??0,assigned??0)*4;
  const status=remaining===null?'Load Not Calculated':Math.abs(remaining)<=tolerance?'At Load Limit':
    remaining<0?'Overloaded':'Available Capacity';
  const canAccept=remaining===null||!validMaxLoad(proposed)?null:proposed<=remaining+tolerance;
  return {maximum,assigned,remaining,status,canAccept};
}

function dispTime(time){const [h,m]=time.split(':').map(Number);return `${(h%12)||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`}
function timeRange(entry){return dispTime(entry.start)+' – '+dispTime(endTime(entry))}
function overlaps(a,b){return a.day===b.day && mins(a.start)<mins(endTime(b)) && mins(b.start)<mins(endTime(a))}
// Preserve the existing timetable constraints for legacy records. SPWMA is advisory.
function legacyFacultyEligible(f,c){return Boolean(c.category&&f.specialties?.includes(c.category))}
function validateEntry(entry,all,skipId=null){const errs=[];const section=find(state.sections,entry.sectionId),course=find(state.courses,entry.courseId),f=find(state.faculty,entry.facultyId),room=find(state.rooms,entry.roomId);if(!section||!course){errs.push('Unknown section or course.');return errs}if(!section.courses.includes(course.id))errs.push(`${courseCode(course)||course.id} is not required for ${section.name}.`);if(!f){errs.push('A professor must be assigned.')}if(!room){errs.push('A classroom must be assigned.')}if(!weekdays.includes(entry.day)||!/^\d{2}:\d{2}$/.test(entry.start)||mins(entry.start)<8*60||mins(endTime(entry))>17*60){errs.push('Choose a valid weekday and a meeting between 8 AM and 5 PM.')}if(f){if(!legacyFacultyEligible(f,course))errs.push(`${f.name} is not eligible to teach ${courseCode(course)||course.id}.`);if(f.days&&!f.days.includes(entry.day))errs.push(`${f.name} is unavailable on ${entry.day}.`);if(f.maxHours&&getHours(f.id,all.filter(x=>x.id!==skipId))+course.hours>f.maxHours)errs.push(`${f.name} would exceed the ${f.maxHours}-hour teaching limit.`)}if(room){if(room.type!==course.roomType)errs.push(`${room.name} does not meet the required ${course.roomType} facility type.`);if(room.capacity<section.students)errs.push(`${room.name} has ${room.capacity} seats for ${section.students} students.`)}const others=all.filter(x=>x.id!==skipId&&x.sectionId===entry.sectionId&&x.courseId===entry.courseId);if(others.length)errs.push(`${section.name} already has an assigned ${courseCode(course)||course.id} session.`);for(const x of all.filter(x=>x.id!==skipId)){if(!overlaps(entry,x))continue;if(x.sectionId===entry.sectionId)errs.push(`${section.name} overlaps ${courseCode(find(state.courses,x.courseId))||x.courseId} (${x.day} ${timeRange(x)}).`);if(entry.facultyId&&x.facultyId===entry.facultyId)errs.push(`Professor overlaps ${find(state.sections,x.sectionId)?.name} / ${courseCode(find(state.courses,x.courseId))||x.courseId}.`);if(entry.roomId&&x.roomId===entry.roomId)errs.push(`Classroom overlaps ${find(state.sections,x.sectionId)?.name} / ${courseCode(find(state.courses,x.courseId))||x.courseId}.`)}return [...new Set(errs)]}
function detectIssues(){const issues=[];for(const [i,x] of state.schedules.entries()){for(const reason of validateEntry(x,state.schedules,x.id))issues.push({key:'V'+i,sectionId:x.sectionId,courseId:x.courseId,reason,kind:'Conflict'})}for(const r of reqs()){if(!state.schedules.some(x=>x.sectionId===r.sectionId&&x.courseId===r.courseId)){const u=state.unresolved.find(x=>x.sectionId===r.sectionId&&x.courseId===r.courseId);issues.push({...r,kind:'Unassigned',reason:u?.reason||'No valid class assignment exists yet.'})}}return issues}
function scheduleGenerate(){const assignments=[];const unresolved=[];const todo=reqs().sort((a,b)=>{const ca=find(state.courses,a.courseId),cb=find(state.courses,b.courseId);const ra=state.faculty.filter(f=>legacyFacultyEligible(f,ca)).length,rb=state.faculty.filter(f=>legacyFacultyEligible(f,cb)).length;return ra-rb||(ca.roomType==='Computer Lab'?-1:1)-(cb.roomType==='Computer Lab'?-1:1)});for(const task of todo){const sec=find(state.sections,task.sectionId),course=find(state.courses,task.courseId);const possibleRooms=state.rooms.filter(r=>r.type===course.roomType&&r.capacity>=sec.students);const candidates=state.faculty.filter(f=>legacyFacultyEligible(f,course)&&f.days&&f.maxHours);let possibilities=[];for(const f of candidates){if(getHours(f.id,assignments)+course.hours>f.maxHours)continue;for(const day of f.days){for(const start of starts){for(const room of possibleRooms){const entry={id:'S'+task.sectionId+task.courseId,sectionId:sec.id,courseId:course.id,facultyId:f.id,roomId:room.id,day,start};if(validateEntry(entry,assignments).length===0){const dIndex=weekdays.indexOf(day),dayCount=assignments.filter(x=>x.sectionId===sec.id&&x.day===day).length;const roomUsage=assignments.filter(x=>x.roomId===room.id).length;const load=getHours(f.id,assignments);const quality=-(dayCount*17)-(load*1.5)-(roomUsage*.8)-dIndex*.6+(start==='08:00'?.5:0);possibilities.push({entry,quality})}}}}}possibilities.sort((a,b)=>b.quality-a.quality);if(possibilities.length)assignments.push(possibilities[0].entry);else{const eligible=state.faculty.filter(f=>legacyFacultyEligible(f,course));let reason=!eligible.length?'No professor has the required specialization.':!possibleRooms.length?'No classroom meets the course type and section capacity.':'No compatible faculty, room, and available time combination satisfies all constraints.';unresolved.push({...task,reason})}}state.schedules=assignments;state.unresolved=unresolved;state.status='Draft';log('Schedule generated',`${assignments.length} assignments created; ${unresolved.length} unresolved. Draft requires review.`,'Schedule');return {assigned:assignments.length,unassigned:unresolved.length}}
function initials(s){return s.replace(/^(Dr\.|Prof\.)\s*/,'').split(' ').slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}

function overview(){const requests=reqs().length,assigned=state.schedules.length,issues=detectIssues(),loadHours=state.schedules.reduce((a,x)=>a+(find(state.courses,x.courseId)?.hours||0),0),util=pct(assigned,requests);const matches=rankFaculty(state.courses.find(c=>courseCode(c)==='CS202')?.id);const ranks=matches.primary?.slice(0,3)||[];const recent=state.logs.slice(0,4);return `${head('Academic control center','Scheduling overview','A centralized look at academic schedules, teaching loads and classroom availability.',btn('Generate timetable','generate','btn btn-primary','bolt'))}<div class="kpi-grid">${statCard('Scheduled classes',assigned,`of ${requests} required class assignments`,'calendar')}${statCard('Faculty members',state.faculty.length,`${state.faculty.filter(f=>getHours(f.id)>0).length} currently assigned`,'users','purple')}${statCard('Classrooms',state.rooms.length,`${state.rooms.filter(r=>state.schedules.some(x=>x.roomId===r.id)).length} rooms in use`,'building','green')}${statCard('Attention needed',issues.length,issues.length?'Unassigned or conflicting classes':'All requirements currently satisfied','alert','amber')}</div>${state.status==='Draft'?banner('Your working schedule is a draft','Run the generator, inspect assignments and publish only after reviewing constraints.','Review schedule','approvals','shield'):banner('The timetable is published',`Revision ${state.version} is available. You can create a new draft to make changes.`,'View published status','approvals','shield')}<div class="layout-two"><div><div class="panel"><div class="panel-head"><div><h2>Scheduling completion</h2><p>Required sections and courses in the active term</p></div><span class="chip ${util===100?'green':'amber'}">${util}% completed</span></div><div class="panel-body"><div class="progress-label"><strong>${assigned} / ${requests} scheduled courses</strong><span>${Math.max(0,requests-assigned)} unassigned</span></div><div class="progress"><div style="width:${util}%"></div></div><div class="stat-split"><div class="mini-stat"><b>${loadHours}<span style="font-size:12px;display:inline;color:inherit"> hrs</span></b><span>Total scheduled weekly teaching hours</span></div><div class="mini-stat"><b>${state.sections.length}</b><span>Academic blocks / sections</span></div></div></div></div><div class="panel"><div class="panel-head"><div><h2>Section schedule snapshot</h2><p>Upcoming assignments for BSCS 2A</p></div><button class="linkbtn" data-page="scheduler">Open builder ${ic('chevron',13)}</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Course</th><th>Day / Time</th><th>Faculty</th><th>Room</th></tr></thead><tbody>${state.schedules.filter(s=>s.sectionId==='B01').sort((a,b)=>weekdays.indexOf(a.day)-weekdays.indexOf(b.day)).map(x=>`<tr><td><strong>${esc(courseCode(find(state.courses,x.courseId))||x.courseId)}</strong><div class="ghost-text">${esc(find(state.courses,x.courseId)?.title)}</div></td><td>${esc(x.day)}<div class="ghost-text">${timeRange(x)}</div></td><td>${esc(find(state.faculty,x.facultyId)?.name)}</td><td><span class="chip">${esc(x.roomId)}</span></td></tr>`).join('')||`<tr><td colspan="4">${empty('No assignments yet','Generate a draft to populate this timetable.')}</td></tr>`}</tbody></table></div></div></div><div><div class="panel"><div class="panel-head"><div><h2>Recent activity</h2><p>Latest actions in this workspace</p></div><button class="linkbtn" data-page="logs">View all</button></div><div class="panel-body">${recent.map(x=>`<div class="activity-item"><div class="activity-dot">${ic(x.type==='Schedule'?'calendar':x.type==='Approval'?'shield':'history')}</div><div><strong>${esc(x.action)}</strong><p>${esc(x.details)}</p><time>${formatDate(x.at)}</time></div></div>`).join('')||'<p class="note">No recorded activity yet.</p>'}</div></div><div class="panel"><div class="panel-head"><div><h2>Top faculty matches</h2><p>For Data Structures & Algorithms</p></div><button class="linkbtn" data-page="ranking">F function normalizeCourseCode(code){return String(code||'').toUpperCase().replace(/\s+/g,'')}
function normalizeProspectusRow(row,year,semester){const keys=Object.keys(row);const get=(names)=>{const k=keys.find(x=>names.some(n=>x.toLowerCase().replace(/[^a-z]/g,'').includes(n)));return k?row[k]:''};const rawCode=String(get(['coursecode','code','subjectcode'])||'').trim();const prefix=String(get(['prefix','subject'])||'').trim();const number=String(get(['numericcode','coursenumber','number'])||'').trim();const code=normalizeCourseCode(rawCode||(prefix&&number?prefix+' '+number:''));const name=String(get(['coursetitle','coursename','title','description'])||'').trim();const num=x=>{const n=Number(String(x??'').replace(/,/g,''));return Number.isFinite(n)?n:0};const lec=num(get(['lecunits','lectureunits','lecture'])),lab=num(get(['labunits','laboratoryunits','lab'])),total=num(get(['units','totalunits','total']));const pre=String(get(['prerequisites','prerequisites','prerequisite'])||'').split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);return code&&name?{courseCode:code,courseName:name,lectureUnits:lec,laboratoryUnits:lab,totalUnits:total||lec+lab,prerequisites:pre,yearLevel:year,semester}:null}
function parseProspectusWorkbook(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=e=>{try{if(!window.XLSX)throw Error('Excel parser is unavailable. Use Demo Import or load the page with internet access.');const wb=XLSX.read(e.target.result,{type:'array'});const courses=[],invalid=[];wb.SheetNames.forEach(sn=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:'',raw:false,header:1});let year=0,semester=0,headers=null;rows.forEach((cells,i)=>{const text=cells.map(x=>String(x||'').trim()).join(' ');const ym=text.match(/(1st|2nd|3rd|4th|first|second|third|fourth)\s*year/i);if(ym)year=['1st','first'].includes(ym[1].toLowerCase())?1:['2nd','second'].includes(ym[1].toLowerCase())?2:['3rd','third'].includes(ym[1].toLowerCase())?3:4;const sm=text.match(/(first|1st|second|2nd)\s*semester/i);if(sm)semester=['first','1st'].includes(sm[1].toLowerCase())?1:2;const normalized=cells.map(x=>String(x||'').toLowerCase().replace(/[^a-z]/g,''));if(normalized.some(x=>x.includes('coursetitle')||x.includes('coursename'))){headers=cells.map((x,j)=>String(x||'').trim()||'Column '+j);return}if(headers&&year&&semester&&cells.some(Boolean)){const row=Object.fromEntries(headers.map((h,j)=>[h,cells[j]??'']));const c=normalizeProspectusRow(row,year,semester);if(c)courses.push(c);else if(text&&!/total|semester|year|curriculum/i.test(text))invalid.push(i+1)}})});const seen=new Set();const duplicates=[];const unique=courses.filter(c=>{const k=c.courseCode.toUpperCase();if(seen.has(k)){duplicates.push(c.courseCode);return false}seen.add(k);return true});resolve({filename:file.name,importedAt:new Date().toISOString(),courses:unique,duplicates,invalid})}catch(err){reject(err)}};reader.onerror=()=>reject(Error('The selected file could not be read.'));reader.readAsArrayBuffer(file)})}
function applyProspectus(p){const duplicateExisting=[],added=[];p.courses.forEach(c=>{c.courseCode=normalizeCourseCode(c.courseCode);const id=c.courseCode;const existing=state.courses.find(x=>courseCode(x)===id);if(existing){duplicateExisting.push(c.courseCode);return}state.courses.push({id:find(state.courses,id)?newRecordId('COURSE',state.courses):id,title:c.courseName,courseCode:id,units:c.totalUnits,lecture:c.lectureUnits,lab:c.laboratoryUnits,hours:c.lectureUnits+c.laboratoryUnits,roomType:c.laboratoryUnits?'Computer Lab':'Lecture',prerequisites:c.prerequisites,yearLevel:c.yearLevel,semester:c.semester});added.push(c.courseCode)});state.prospectus={...p,courses:p.courses.map(c=>({...c,courseCode:normalizeCourseCode(c.courseCode),existing:duplicateExisting.includes(normalizeCourseCode(c.courseCode))}))};save();render();toast(`Imported ${added.length} new course${added.length===1?'':'s'}${duplicateExisting.length?`; ${duplicateExisting.length} duplicate${duplicateExisting.length===1?'':'s'} skipped`:'.'}`)}

function importProspectusModal(){showModal('Import Academic Prospectus',`<div id="prospectus-import-body"><label class="light-section" style="display:block;text-align:center;border-style:dashed;padding:28px"><strong>Drop an Excel prospectus here</strong><p>or choose a file from your computer</p><input id="prospectus-file" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" style="margin-top:14px"/><p class="help">Accepted formats: .xlsx and .xls · Course codes, units, year and semester are detected automatically.</p></label><div style="margin-top:14px">${btn('Use demo prospectus','demo-prospectus','btn btn-quiet','sparkles')}</div></div>`,`${btn('Cancel','close-modal','btn')}${btn('Confirm import','confirm-prospectus','btn btn-primary','check','disabled')}`,true);document.getElementById('prospectus-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;const body=document.getElementById('prospectus-import-body');if(!/\.(xlsx|xls)$/i.test(file.name)){body.insertAdjacentHTML('beforeend','<div class="alert red" style="margin-top:14px">Unsupported file. Please choose an .xlsx or .xls workbook.</div>');return}body.innerHTML='<p class="note">Reading workbook and extracting course records…</p>';try{const p=await parseProspectusWorkbook(file);body.innerHTML=prospectusPreview(p);document.querySelector('[data-action="confirm-prospectus"]').disabled=!p.courses.length;document.querySelector('[data-action="confirm-prospectus"]').dataset.payload=encodeURIComponent(JSON.stringify(p))}catch(err){body.innerHTML=`<div class="alert red">${esc(err.message)}</div>`}}) }

function saveFaculty(form,fd){
  const old=find(state.faculty,form.dataset.id);
  const id=form.dataset.facultyId;
  const name=String(fd.get('name')||'').trim().replace(/\s+/g,' ');
  const departmentId=fd.get('departmentId'),employmentTypeId=fd.get('employmentTypeId');
  const department=find(state.departments,departmentId),employment=find(state.employmentTypes,employmentTypeId);
  if(!name)return 'Enter the professor name.';
  if(!department||(!department.isActive&&departmentId!==old?.departmentId))return 'Select a configured department.';
  if(!employment||(!employment.isActive&&employmentTypeId!==old?.employmentTypeId))return 'Select a configured employment type.';
  if(!validMaxLoad(employment.maxLoad))return 'Configure a positive teaching-load limit for this employment type in Faculty Configuration.';
  if((!old&&find(state.faculty,id))||(form.dataset.id&&!old))return 'This faculty identifier is already used or the record could not be found. Reopen the form.';
  if(state.faculty.some(f=>f.id!==id&&recordKey(f.name)===recordKey(name)&&
    (f.departmentId===departmentId||!f.departmentId)))return 'A professor with this name already exists in this department or needs department review.';
  const ids=fd.getAll('specialization'),verified=new Set(fd.getAll('verified'));
  if(new Set(ids).size!==ids.length)return 'Specializations must be unique.';
  const previous=new Map((old?.specializationAssociations||[]).map(x=>[x.specializationId,x]));
  if(ids.some(id=>{
    const item=find(state.specializations,id);
    return !item||(!specializationSelectable(item)&&!previous.has(id));
  }))return 'Select valid subject specializations.';
  const specializationAssociations=ids.map(specializationId=>{
    const status=verified.has(specializationId)?'verified':'pending';
    return {specializationId,status,verifiedAt:status==='verified'?
      previous.get(specializationId)?.verifiedAt||new Date().toISOString():null};
  });
  const profile={id,name,departmentId,employmentTypeId,specializationAssociations};
  if(old)Object.assign(old,profile);
  else state.faculty.push(profile);
  log(old?'Faculty profile updated':'Faculty added',`${name} (${id}) · ${department.name} · ${employment.name}`,'Faculty');
  for(const association of specializationAssociations){
    if((previous.get(association.specializationId)?.status||'pending')!==association.status){
      log(association.status==='verified'?'Specialization verified':'Verification returned to pending',
        `${name} (${id}) · ${specializationName(association.specializationId)}`,'Faculty');
    }
    previous.delete(association.specializationId);
  }
  for(const association of previous.values()){
    log('Faculty specialization removed',`${name} (${id}) · ${specializationName(association.specializationId)}`,'Faculty');
  }
  return '';
}
function saveFacultyConfig(form,fd){
  const group=form.dataset.group,label=facultyConfigLabels[group],records=state[group];
  const id=form.dataset.id,old=find(records,id);
  const name=String(fd.get('name')||'').trim().replace(/\s+/g,' ');

  if(records.some(x=>x.id!==id&&recordKey(x.name)===recordKey(name)))return 'This name is already in use.';
  const prefix={departments:'DEP',specializations:'SPEC',employmentTypes:'EMP'}[group];
  const data={id:id||newRecordId(prefix,records),name,isActive:fd.get('isActive')==='true'};
  if(group==='employmentTypes'){
    data.maxLoad=Number(fd.get('maxLoad'));
    if(!validMaxLoad(data.maxLoad))return 'Enter a positive maximum teaching load.';
  }else{
    data.code=String(fd.get('code')||'').trim().toUpperCase();

    if(!data.code)return 'Enter a code.';
    if(records.some(x=>x.id!==id&&recordKey(x.code)===recordKey(data.code)))return 'This code is already in use.';

    if(!department||(!department.isActive&&department.id!==old?.departmentId))return 'Select an active department.';
    data.departmentId=department.id;

  return '';
}
function saveCourse(form,fd){
  const id=form.dataset.id,old=find(state.courses,id);
  const code=normalizeCourseCode(fd.get('id')),title=String(fd.get('title')||'').trim();
  const lecture=Number(fd.get('lecture')),lab=Number(fd.get('lab')),hours=lecture+lab;
  if(!code||!title)return 'Enter a course code and title.';
  if(hours<1||hours>8)return 'Lecture + laboratory contact hours must be 1–8 hours.';
  if(state.courses.some(c=>c.id!==id&&courseCode(c)===code))return 'This course code already exists.';
  if(id&&!old)return 'The course could not be found.';
  const mainId=fd.get('mainId')||null,relatedIds=fd.getAll('related');
  const error=courseSpecializationError(mainId,relatedIds,old?.specializationConfig);
  if(error)return error;
  const specializationConfig={...(old?.specializationConfig??spwmaPolicy),mainId,relatedIds};
  const course={
    id:old?.id||(find(state.courses,code)?newRecordId('COURSE',state.courses):code),
    courseCode:code,title,lecture,lab,units:hours,hours,roomType:old?.roomType||(lab>0?'Computer Lab':'Lecture'),
    specializationConfig
  };
  if(old){
    const previousCode=courseCode(old);
    Object.assign(old,course);
    if(previousCode!==code){
      for(const record of state.courses){
        record.prerequisites=record.prerequisites?.map(value=>normalizeCourseCode(value)===previousCode?code:value)??[];
      }
    }
  }else state.courses.push(course);
  const main=mainId?specializationName(mainId):'unconfigured';
  const related=relatedIds.map(specializationName).join(', ')||'none';
  log(old?'Course updated':'Course created',`${code} — ${title} · Main specialization ${main} · Related specializations ${related} · SPWMA ${specializationConfig.version}`,'Catalog');
  return '';
}

function buildBlockDraft(prospectus,program){
  const groups=new Map();
  for(const course of prospectus.courses){
    const key=`${course.yearLevel}-${course.semester}`;
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(course);
  }
  const prefix=program==='BS Accountancy'?'BSA':program.split(/\s+/).map(word=>word[0]).join('').toUpperCase();
  return [...groups].sort(([a],[b])=>a.localeCompare(b)).map(([key,courses])=>{
    const [year,semester]=key.split('-').map(Number);
    const name=`${prefix}${year}${semester}`;
    const existing=state.sections.find(s=>s.program===program&&s.year===year&&Number(s.semester||1)===semester);
    return {key,name,program,year,semester,courses,existing};
  });
}

function blockCourseCode(value){return value.toUpperCase().replace(/\s+/g,'')}

function blockCourseConflicts(group){
  const titleKey=title=>title.trim().replace(/\s+/g,' ').toLowerCase();
  return group.courses.flatMap(course=>{
    if(!course.courseCode)return [];
    const existing=state.courses.find(c=>courseCode(c)===blockCourseCode(course.courseCode));
    return existing&&titleKey(existing.title)!==titleKey(course.courseName)?[{course,existing}]:[];
  });
}

function confirmBlockImport(){
  const body=document.getElementById('block-import-body');
  const error=body?.querySelector('#block-draft-error');
  if(!blockImportDraft||!error)return;
  const staged=[];
  const names=new Set(state.sections.map(s=>`${s.program.toLowerCase()}:${s.name.trim().toLowerCase()}`));
  for(const [index,group] of blockImportDraft.groups.entries()){
    if(group.existing||!body.querySelector(`[data-draft-include="${index}"]`)?.checked)continue;
    const name=body.querySelector(`[data-draft-name="${index}"]`).value.trim().replace(/\s+/g,' ');
    const key=`${group.program.toLowerCase()}:${name.toLowerCase()}`;
    if(!group.program||!name||names.has(key)){
      error.textContent='Choose a program and enter a unique name for each included block.';
      return;
    }
    if(blockCourseConflicts(group).length&&!body.querySelector(`[data-draft-use-existing="${index}"]`)?.checked){
      error.textContent=`Review the catalog title conflicts for ${name} before confirming.`;
      return;
    }
    names.add(key);
    staged.push({...group,name});
  }
  if(!staged.length){
    error.textContent='Select at least one block to generate.';
    return;
  }
  const catalog=new Map(state.courses.filter(course=>courseCode(course)).map(course=>[courseCode(course),course]));
  const newCourses=[];
  const batchId=Date.now();
  const sections=staged.map((group,index)=>{
    const courses=new Set();
    for(const [courseIndex,course] of group.courses.entries()){
      const code=blockCourseCode(course.courseCode);
      const catalogKey=code||`__uncoded:${group.key}:${course.courseName.toLowerCase()}`;
      if(!catalog.has(catalogKey)){
        const entry={
          id:code&&!find(state.courses,code)?code:`COURSE-${batchId}-${index}-${courseIndex}`,courseCode:code,title:course.courseName,units:course.totalUnits,
          lecture:course.lectureUnits,lab:course.laboratoryUnits,
          hours:course.lectureUnits+course.laboratoryUnits,
          roomType:course.laboratoryUnits?'Computer Lab':'Lecture',
          prerequisites:course.prerequisites,isUncoded:!code
        };
        catalog.set(catalogKey,entry);
        newCourses.push(entry);
      }
      courses.add(catalog.get(catalogKey).id);
    }
    const program=state.academicPrograms.find(item=>item.name===group.program||item.code===group.program);
    const semester=state.semesters.find(item=>item.order===group.semester);
    return {id:`B${batchId}-${index}`,name:group.name,program:program?.name||group.program,
      academicProgramId:program?.id,year:group.year,sectionNumber:index+1,
      semester:semester?.order||group.semester,semesterId:semester?.id,courses:[...courses]};
  });
  state.courses.push(...newCourses);
  state.sections.push(...sections);
  blockImportDraft=null;
  save();
  closeModal();
  navigate('sections');
  toast(`Generated ${sections.length} academic block${sections.length===1?'':'s'}.`);
}

document.addEventListener('change',e=>{const v=e.target;if(v.dataset.control==='ranking-course'){rankingCourse=v.value;render()}if(v.dataset.control==='section-filter'){sectionFilter=v.value;render()}if(v.dataset.control==='log-filter'){logFilter=v.value;render()}if(v.dataset.control==='facility-filter'){facilityFilter=v.value;render()}if(v.dataset.control==='location-filter'){locationFilter=v.value;render()}});
document.addEventListener('input',e=>{if(e.target.matches('[data-search]')){const pos=e.target.selectionStart;searchTerm=e.target.value;render();const n=document.querySelector('[data-search]');n?.focus();n?.setSelectionRange(pos,pos)}});
document.addEventListener('input',e=>{if(e.target.matches('[data-section-course-search]')){const q=e.target.value.toLowerCase().replace(/\s+/g,'');document.querySelectorAll('[data-course-row]').forEach(row=>{row.style.display=String(row.dataset.courseSearch||'').includes(q)?'':'none'})}});
document.addEventListener('change',e=>{if(e.target.matches('#editor[data-form="section"] input[name="course"]')){const row=e.target.closest('[data-course-row]');row?.classList.toggle('selected',e.target.checked);const count=document.querySelectorAll('#editor[data-form="section"] input[name="course"]:checked').length;const label=document.querySelector('[data-selected-course-count]');if(label)label.textContent=`${count} courses selected`}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMenu()}});
document.addEventListener('input',e=>{
  const input=e.target;
  if(input.matches('[data-filter-search]')){
    if(input.id==='catalog-specialization-search')specializationSearch=input.value;
    updateSpecializationFilter(input.closest('[data-specialization-filter]'));
  }
  if(input.matches('[data-ranking-search]')){
    const query=recordKey(input.value),select=document.getElementById('f-rankingCourse');
    for(const option of select.options){
      option.hidden=Boolean(option.value&&option.value!==select.value&&
        !recordKey(option.textContent).includes(query)&&!recordKey(option.textContent).replace(/\s+/g,'').includes(query.replace(/\s+/g,'')));
    }
  }
  if(input.matches('[data-proposed-load]')){
    proposedLoad=validMaxLoad(input.valueAsNumber)?input.valueAsNumber:null;
    document.querySelector('[data-ranking-results]').innerHTML=rankingResults(rankFaculty(rankingCourse));
  }
});
document.addEventListener('change',e=>{
  const input=e.target,form=input.closest('#editor');
  if(input.matches('[data-department-filter]')){
    if(!form)specializationDepartment=input.value;
    updateSpecializationFilter(input.closest('[data-specialization-filter]'));
  }
  if(!form)return;
  if(form.dataset.form==='faculty'){
    if(input.name==='employmentTypeId')form.querySelector('[data-faculty-load]').innerHTML=facultyLoadSummary(form.dataset.id,input.value);
    if(input.name==='specialization')updateSpecializationRow(input.closest('[data-specialization-row]'));
  }
  if(form.dataset.form==='course'&&['mainId','related'].includes(input.name))updateCourseSpecializationEditor(form);
});
document.addEventListener('submit',e=>{
  if(!e.target.matches('#editor'))return;
  e.preventDefault();
  modalSubmit();
});
document.getElementById('scrim').addEventListener('click',closeMenu);
if(state.logs.length===0){
  log('Demo environment initialized','Academic records and sample sections loaded.','System');
  if(!state.schedules.length&&!state.version){
    const r=scheduleGenerate();
    log('Draft ready for review',`${r.assigned} class meetings scheduled for AY 2026–2027.`,'Schedule');
  }
}
const initialPage=location.hash.slice(1);
if([...navMain,...navAdmin].some(([id])=>id===initialPage)||['ranking','faculty-ranking','faculty-management'].includes(initialPage))navigate(initialPage);
else render();
</script>
</body>
</html>

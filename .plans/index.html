function load(){try{const raw=localStorage.getItem(key);const v=raw?JSON.parse(raw):null;if(v&&v.faculty&&v.courses&&v.sections&&v.rooms&&v.schedules&&v.logs){return v}}catch(err){console.warn('Resetting invalid demo cache',err)}return seed()}
let state=load();weights={...weights,...state.weights};
function save(){state.weights={...weights};state.updatedAt=new Date().toISOString();try{localStorage.setItem(key,JSON.stringify(state))}catch(e){console.warn('Local storage unavailable',e)}}
function log(action,details,type='System'){state.logs.unshift({id:'L'+Date.now()+Math.random().toString(36).slice(2,5),action,details,type,user:'Admin User',at:new Date().toISOString()});state.logs=state.logs.slice(0,150);save()}
function find(arr,id){return arr.find(x=>x.id===id)}
function reqs(){return state.sections.flatMap(s=>s.courses.filter(id=>find(state.courses,id)).map(c=>({sectionId:s.id,courseId:c,key:s.id+'__'+c})))}
function getHours(fid,schedules=state.schedules){return schedules.filter(x=>x.facultyId===fid).reduce((a,x)=>a+(find(state.courses,x.courseId)?.hours||0),0)}
function mins(time){const [h,m]=time.split(':').map(Number);return h*60+m}
function endTime(entry){const n=mins(entry.start)+(find(state.courses,entry.courseId)?.hours||3)*60;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function dispTime(time){const [h,m]=time.split(':').map(Number);return `${(h%12)||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`}
function timeRange(entry){return dispTime(entry.start)+' – '+dispTime(endTime(entry))}
function overlaps(a,b){return a.day===b.day && mins(a.start)<mins(endTime(b)) && mins(b.start)<mins(endTime(a))}
function facultyEligible(f,c){return f.specialties.includes(c.category)}
function rankFaculty(courseId,schedules=state.schedules){const course=find(state.courses,courseId);if(!course)return [];return state.faculty.filter(f=>facultyEligible(f,course)).map(f=>{const load=getHours(f.id,schedules);const detail={expertise:f.specialties[0]===course.category?100:88,experience:Math.min(100,Math.round(f.years/15*80+(f.taughtCourses?.includes(courseId)?20:0))),qualification:f.degree==='PhD'?100:f.degree==='Masters'?85:60,availability:Math.round(f.days.length/5*100),workload:Math.max(0,Math.round((1-load/f.maxHours)*100))};const score=Object.entries(weights).reduce((a,[k,w])=>a+detail[k]*w/100,0);return {...f,load,detail,score:Math.round(score*10)/10}}).sort((a,b)=>b.score-a.score||a.id.localeCompare(b.id))}
function validateEntry(entry,all,skipId=null){const errs=[];const section=find(state.sections,entry.sectionId),course=find(state.courses,entry.courseId),f=find(state.faculty,entry.facultyId),room=find(state.rooms,entry.roomId);if(!section||!course){errs.push('Unknown section or course.');return errs}if(!section.courses.includes(course.id))errs.push(`${course.id} is not required for ${section.name}.`);if(!f){errs.push('A professor must be assigned.')}if(!room){errs.push('A classroom must be assigned.')}if(!weekdays.includes(entry.day)||!/^\d{2}:\d{2}$/.test(entry.start)||mins(entry.start)<8*60||mins(endTime(entry))>17*60){errs.push('Choose a valid weekday and a meeting between 8 AM and 5 PM.')}if(f){if(!facultyEligible(f,course))errs.push(`${f.name} is not eligible to teach ${course.id}.`);if(!f.days.includes(entry.day))errs.push(`${f.name} is unavailable on ${entry.day}.`);if(getHours(f.id,all.filter(x=>x.id!==skipId))+course.hours>f.maxHours)errs.push(`${f.name} would exceed the ${f.maxHours}-hour teaching limit.`)}if(room){if(room.type!==course.roomType)errs.push(`${room.name} does not meet the required ${course.roomType} facility type.`);if(room.capacity<section.students)errs.push(`${room.name} has ${room.capacity} seats for ${section.students} students.`)}const others=all.filter(x=>x.id!==skipId&&x.sectionId===entry.sectionId&&x.courseId===entry.courseId);if(others.length)errs.push(`${section.name} already has an assigned ${course.id} session.`);for(const x of all.filter(x=>x.id!==skipId)){if(!overlaps(entry,x))continue;if(x.sectionId===entry.sectionId)errs.push(`${section.name} overlaps ${x.courseId} (${x.day} ${timeRange(x)}).`);if(entry.facultyId&&x.facultyId===entry.facultyId)errs.push(`Professor overlaps ${find(state.sections,x.sectionId)?.name} / ${x.courseId}.`);if(entry.roomId&&x.roomId===entry.roomId)errs.push(`Classroom overlaps ${find(state.sections,x.sectionId)?.name} / ${x.courseId}.`)}return [...new Set(errs)]}
function detectIssues(){const issues=[];for(const [i,x] of state.schedules.entries()){for(const reason of validateEntry(x,state.schedules,x.id))issues.push({key:'V'+i,sectionId:x.sectionId,courseId:x.courseId,reason,kind:'Conflict'})}for(const r of reqs()){if(!state.schedules.some(x=>x.sectionId===r.sectionId&&x.courseId===r.courseId)){const u=state.unresolved.find(x=>x.sectionId===r.sectionId&&x.courseId===r.courseId);issues.push({...r,kind:'Unassigned',reason:u?.reason||'No valid class assignment exists yet.'})}}return issues}
function scheduleGenerate(){const assignments=[];const unresolved=[];const todo=reqs().sort((a,b)=>{const ca=find(state.courses,a.courseId),cb=find(state.courses,b.courseId);const ra=rankFaculty(a.courseId,[]).length,rb=rankFaculty(b.courseId,[]).length;return ra-rb||(ca.roomType==='Computer Lab'?-1:1)-(cb.roomType==='Computer Lab'?-1:1)});for(const task of todo){const sec=find(state.sections,task.sectionId),course=find(state.courses,task.courseId);const possibleRooms=state.rooms.filter(r=>r.type===course.roomType&&r.capacity>=sec.students);const ranked=rankFaculty(course.id,assignments);let possibilities=[];for(const f of ranked){if(getHours(f.id,assignments)+course.hours>f.maxHours)continue;for(const day of f.days){for(const start of starts){for(const room of possibleRooms){const entry={id:'S'+task.sectionId+task.courseId,sectionId:sec.id,courseId:course.id,facultyId:f.id,roomId:room.id,day,start};if(validateEntry(entry,assignments).length===0){const dIndex=weekdays.indexOf(day),dayCount=assignments.filter(x=>x.sectionId===sec.id&&x.day===day).length;const roomUsage=assignments.filter(x=>x.roomId===room.id).length;const load=getHours(f.id,assignments);const quality=f.score-(dayCount*17)-(load*1.5)-(roomUsage*.8)-dIndex*.6+(start==='08:00'?.5:0);possibilities.push({entry,quality})}}}}}possibilities.sort((a,b)=>b.quality-a.quality);if(possibilities.length)assignments.push(possibilities[0].entry);else{const eligible=state.faculty.filter(f=>facultyEligible(f,course));let reason=!eligible.length?'No professor has the required specialization.':!possibleRooms.length?'No classroom meets the course type and section capacity.':'No compatible faculty, room, and available time combination satisfies all constraints.';unresolved.push({...task,reason})}}state.schedules=assignments;state.unresolved=unresolved;state.status='Draft';log('Schedule generated',`${assignments.length} assignments created; ${unresolved.length} unresolved. Draft requires review.`,'Schedule');return {assigned:assignments.length,unassigned:unresolved.length}}
function initials(s){return s.replace(/^(Dr\.|Prof\.)\s*/,'').split(' ').slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function formatDate(iso){return new Date(iso).toLocaleString('en-PH',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}
function pct(n,d){return d?Math.round(n/d*100):0}
function statusBadge(){return state.status==='Published'?'<span class="chip green">● Published</span>':'<span class="chip amber">● Draft</span>'}
function head(eyebrow,title,subtitle,actions=''){return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div><div class="actions">${actions}</div></div>`}
function btn(label,action,style='btn',iconName='',extra=''){return `<button class="${style}" data-action="${action}" ${extra}>${iconName?ic(iconName,15):''}${label}</button>`}
function statCard(label,value,foot,iconName,tone=''){return `<article class="kpi"><div class="kpi-top"><span class="kpi-label">${label}</span><div class="kpi-ico ${tone}">${ic(iconName)}</div></div><div class="kpi-val mono">${value}</div><div class="kpi-foot">${foot}</div></article>`}
function banner(text,sub,label,action,iconName='bolt'){return `<div class="banner"><div class="banner-icon">${ic(iconName,22)}</div><div><strong>${text}</strong><p>${sub}</p></div>${label?btn(label,action,'btn btn-primary','arrow'):''}</div>`}
function empty(title,desc,action='',label=''){return `<div class="empty">${ic('info',35)}<h3>${title}</h3><p>${desc}</p>${action?btn(label,action,'btn btn-primary'):''}</div>`}
function renderNav(){const nav=(array)=>array.map(([k,label,icon])=>`<button class="${page===k?'active':''}" data-page="${k}">${ic(icon)}<span>${label}</span>${k==='conflicts'&&detectIssues().length?`<span class="nav-count">${detectIssues().length}</span>`:''}</button>`).join('');document.getElementById('nav-main').innerHTML=nav(navMain);document.getElementById('nav-admin').innerHTML=nav(navAdmin);document.getElementById('breadcrumb').textContent=[...navMain,...navAdmin].find(x=>x[0]===page)?.[1]||'Overview'}
function overview(){const requests=reqs().length,assigned=state.schedules.length,issues=detectIssues(),loadHours=state.schedules.reduce((a,x)=>a+(find(state.courses,x.courseId)?.hours||0),0),util=pct(assigned,requests);const ranks=rankFaculty('CS202').slice(0,3);const recent=state.logs.slice(0,4);return `${head('Academic control center','Scheduling overview','A centralized look at academic schedules, teaching loads and classroom availability.',btn('Generate timetable','generate','btn btn-primary','bolt'))}<div class="kpi-grid">${statCard('Scheduled classes',assigned,`of ${requests} required class assignments`,'calendar')}${statCard('Faculty members',state.faculty.length,`${state.faculty.filter(f=>getHours(f.id)>0).length} currently assigned`,'users','purple')}${statCard('Classrooms',state.rooms.length,`${state.rooms.filter(r=>state.schedules.some(x=>x.roomId===r.id)).length} rooms in use`,'building','green')}${statCard('Attention needed',issues.length,issues.length?'Unassigned or conflicting classes':'All requirements currently satisfied','alert','amber')}</div>${state.status==='Draft'?banner('Your working schedule is a draft','Run the generator, inspect assignments and publish only after reviewing constraints.','Review schedule','approvals','shield'):banner('The timetable is published',`Revision ${state.version} is available. You can create a new draft to make changes.`,'View published status','approvals','shield')}<div class="layout-two"><div><div class="panel"><div class="panel-head"><div><h2>Scheduling completion</h2><p>Required sections and courses in the active term</p></div><span class="chip ${util===100?'green':'amber'}">${util}% completed</span></div><div class="panel-body"><div class="progress-label"><strong>${assigned} / ${requests} scheduled courses</strong><span>${Math.max(0,requests-assigned)} unassigned</span></div><div class="progress"><div style="width:${util}%"></div></div><div class="stat-split"><div class="mini-stat"><b>${loadHours}<span style="font-size:12px;display:inline;color:inherit"> hrs</span></b><span>Total scheduled weekly teaching hours</span></div><div class="mini-stat"><b>${state.sections.length}</b><span>Academic blocks / sections</span></div></div></div></div><div class="panel"><div class="panel-head"><div><h2>Section schedule snapshot</h2><p>Upcoming assignments for BSCS 2A</p></div><button class="linkbtn" data-page="scheduler">Open builder ${ic('chevron',13)}</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Course</th><th>Day / Time</th><th>Faculty</th><th>Room</th></tr></thead><tbody>${state.schedules.filter(s=>s.sectionId==='B01').sort((a,b)=>weekdays.indexOf(a.day)-weekdays.indexOf(b.day)).map(x=>`<tr><td><strong>${esc(x.courseId)}</strong><div class="ghost-text">${esc(find(state.courses,x.courseId)?.title)}</div></td><td>${esc(x.day)}<div class="ghost-text">${timeRange(x)}</div></td><td>${esc(find(state.faculty,x.facultyId)?.name)}</td><td><span class="chip">${esc(x.roomId)}</span></td></tr>`).join('')||`<tr><td colspan="4">${empty('No assignments yet','Generate a draft to populate this timetable.')}</td></tr>`}</tbody></table></div></div></div><div><div class="panel"><div class="panel-head"><div><h2>Recent activity</h2><p>Latest actions in this workspace</p></div><button class="linkbtn" data-page="logs">View all</button></div><div class="panel-body">${recent.map(x=>`<div class="activity-item"><div class="activity-dot">${ic(x.type==='Schedule'?'calendar':x.type==='Approval'?'shield':'history')}</div><div><strong>${esc(x.action)}</strong><p>${esc(x.details)}</p><time>${formatDate(x.at)}</time></div></div>`).join('')||'<p class="note">No recorded activity yet.</p>'}</div></div><div class="panel"><div class="panel-head"><div><h2>Top faculty matches</h2><p>For Data Structures & Algorithms</p></div><button class="linkbtn" data-page="ranking">Full ranking</button></div><div class="panel-body">${ranks.map((f,i)=>`<div class="rank-row"><div class="rank-number">0${i+ function facultyPage(){const q=searchTerm.toLowerCase();const fs=state.faculty.filter(f=>(f.name+' '+f.department+' '+f.specialties.join(' ')).toLowerCase().includes(q));return `${head('Faculty registry','Faculty management','Manage professor profiles, teaching specializations, weekly availability and workload limits.',btn('Add professor','add-faculty','btn btn-primary','plus'))}<div class="toolbar"><div class="toolbar-left"><div class="search">${ic('search')}<input data-search placeholder="Search professor, department or expertise" value="${esc(searchTerm)}" aria-label="Search professors" /></div></div><div class="text-muted">${fs.length} professors listed</div></div><div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Professor</th><th>Specializations</th><th>Experience</th><th>Teaching load</th><th>Availability</th><th>Actions</th></tr></thead><tbody>${fs.map(f=>{const hrs=getHours(f.id);return `<tr><td><div class="identity"><div class="initials">${initials(f.name)}</div><div><strong>${esc(f.name)}</strong><small>${esc(f.department)}</small></div></div></td><td><div class="chips">${f.specialties.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></td><td><strong>${f.years} years</strong><div class="ghost-text">${esc(f.degree)} · Taught: ${esc((f.taughtCourses||[]).join(', ')||'Not recorded')}</div></td><td><strong class="mono">${hrs} / ${f.maxHours} hrs</strong><div class="progress" style="height:5px;margin-top:9px;max-width:130px"><div style="width:${Math.min(100,pct(hrs,f.maxHours))}%;background:${hrs>=f.maxHours?'#e4a25b':'#2badb2'}"></div></div></td><td><span class="chip ${f.days.length>=4?'green':'amber'}">${f.days.length} days/week</span></td><td>${btn('Edit','edit-faculty','btn btn-sm','edit',`data-id="${f.id}"`)}</td></tr>`}).join('')||`<tr><td colspan="6">${empty('No professors found','Try another search or add a faculty profile.')}</td></tr>`}</tbody></table></div></div><div class="rule"><b>Availability and qualifications are hard constraints.</b> Professors without the required specialization will not be considered by the ranking or automated timetable generator.</div>`}
function rankingPage(){const course=find(state.courses,rankingCourse)||state.courses[0],rs=rankFaculty(course.id);return `${head('Decision support','Faculty ranking & matching','Compare eligible professors using a configurable, explainable weighted ranking model.',btn('Configure weights','weights','btn','sliders'))}<div class="layout-two"><div><div class="panel"><div class="panel-head"><div><h2>Faculty recommendations</h2><p>Ranked by relevance, experience, qualification, availability and workload</p></div><span class="chip purple">Advisory only</span></div><div class="panel-body"><div class="field" style="margin-bottom:14px"><label for="rank-course">Select a course to evaluate</label><select id="rank-course" data-control="ranking-course" class="select" style="width:100%">${state.courses.map(c=>`<option value="${esc(c.id)}" ${c.id===course.id?'selected':''}>${esc(c.id)} — ${esc(c.title)}</option>`).join('')}</select></div>${rs.length?rs.map((f,i)=>`<div class="rank-row"><div class="rank-number">${String(i+1).padStart(2,'0')}</div><div class="initials">${initials(f.name)}</div><div class="rank-name"><strong>${esc(f.name)} ${i===0?'<span class="chip green">Top match</span>':''}</strong><small>${esc(f.degree)} · ${f.years} years · ${f.load}/${f.maxHours} teaching hours</small><div class="score-bar"><span style="width:${f.score}%"></span></div></div><div class="rank-score mono">${f.score}<small>/100</small></div></div>`).join(''):empty('No eligible professors','Edit a faculty profile to include this course specialization.')}</div></div><div class="panel"><div class="panel-head"><h2>Ranking transparency</h2></div><div class="panel-body"><p class="note" style="margin-top:0">The model calculates an overall score from weighted factors. <strong>Only faculty explicitly qualified for the course enter the candidate list.</strong> Scores aid decisions but do not make automatic hiring or authorization decisions.</p><div class="rule"><b>Score:</b> Expertise × ${weights.expertise}% + Experience × ${weights.experience}% + Qualification × ${weights.qualification}% + Availability × ${weights.availability}% + Workload × ${weights.workload}%.</div></div></div></div><div><div class="panel"><div class="panel-head"><div><h2>Weight distribution</h2><p>Current evaluation model · Total 100%</p></div></div><div class="panel-body">${Object.entries(weights).map(([k,v])=>`<div class="weight-box"><label><span>${k[0].toUpperCase()+k.slice(1)}</span><b>${v}%</b></label><div class="progress"><div style="width:${v}%"></div></div></div>`).join('')}<div style="margin-top:19px">${btn('Adjust criteria','weights','btn w-full','sliders')}</div></div></div><div class="panel"><div class="panel-head"><h2>How matching works</h2></div><div class="panel-body"><ol class="simple-list"><li>Confirm course specialization.</li><li>Filter professors by qualifications.</li><li>Score five weighted factors.</li><li>Rank the eligible candidates.</li><li>Check time and workload when assigning.</li></ol></div></div></div></div>`}
function coursesPage(){const q=searchTerm.toLowerCase();const data=state.courses.filter(c=>(c.id+' '+c.title+' '+(c.prerequisites||[]).join(' ')).toLowerCase().includes(q));return `${head('Academic catalog','Courses & curriculum','Maintain course codes, titles, academic units and prerequisite requirements.',btn('Import prospectus','import-prospectus','btn btn-primary','upload')+btn('Add course','add-course','btn','plus'))}<div class="toolbar"><div class="toolbar-left"><div class="search">${ic('search')}<input data-search placeholder="Search course code, title or prerequisite" value="${esc(searchTerm)}" /></div></div><span class="ghost-text">${data.length} catalog courses</span></div><div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Course code & title</th><th>Units</th><th>Lecture / Lab</th><th>Prerequisites</th><th>Assigned blocks</th><th>Actions</th></tr></thead><tbody>${data.map(c=>`<tr><td><strong>${esc(c.id)}</strong><div class="ghost-text">${esc(c.title)}</div></td><td><strong>${c.units}</strong></td><td>${c.lecture}h / ${c.lab}h <div class="ghost-text">${c.hours}h weekly</div></td><td>${esc((c.prerequisites||[]).join(', ')||'—')}</td><td><strong>${state.sections.filter(s=>s.courses.includes(c.id)).length}</strong></td><td>${btn('Edit','edit-course','btn btn-sm','edit',`data-id="${esc(c.id)}"`)}</td></tr>`).join('')||`<tr><td colspan="6">${empty('No courses found','Try another search or add a new course.')}</td></tr>`}</tbody></table></div></div><div class="rule"><b>Prospectus format:</b> Course records use course code, course title, lecture units, laboratory units, total units and prerequisites. Curriculum assignments remain connected to the existing blocks and sections.</div>`}
function sectionsPage(){return `${head('Student cohorts','Blocks & sections','Organize academic blocks by program and year, and assign their required course lists.',btn('Add block','add-section','btn btn-primary','plus'))}<div class="card-grid">${state.sections.map(s=>{const completed=state.schedules.filter(x=>x.sectionId===s.id).length;return `<div class="room-card"><div style="display:flex;justify-content:space-between;align-items:center"><div class="room-icon">${ic('graduation')}</div><span class="chip ${completed===s.courses.length?'green':'amber'}">${completed}/${s.courses.length} scheduled</span></div><h3>${esc(s.name)}</h3><p>${esc(s.program)} · Year ${s.year}</p><div class="pill-row" style="margin:10px 0 16px">${s.courses.map(id=>`<span class="chip gray">${esc(id)}</span>`).join('')}</div><div class="line"><span>${ic('users',12)} ${s.students} students</span>${btn('Manage','edit-section','btn btn-sm','edit',`data-id="${esc(s.id)}"`)}</div></div>`}).join('')}</div>`}
function roomsPage(){return `${head('Learning spaces','Classroom allocation','Track classroom types, seating capacities and scheduled teaching-space assignments.',btn('Add classroom','add-room','btn btn-primary','plus'))}<div class="card-grid">${state.rooms.map(r=>{const booked=state.schedules.filter(x=>x.roomId===r.id).length;return `<div class="room-card"><div style="display:flex;justify-content:space-between;align-items:center"><div class="room-icon">${ic('building')}</div><span class="tagline">${esc(r.type)}</span></div><h3>${esc(r.name)}</h3><p>${esc(r.building)}</p><div class="line"><span>Capacity</span><strong>${r.capacity} seats</strong></div><div class="line" style="margin-top:9px"><span>Assigned meetings</span><strong>${booked} / week</strong></div><div style="margin-top:14px">${btn('Edit room','edit-room','btn btn-sm','edit',`data-id="${esc(r.id)}"`)}</div></div>`}).join('')}</div>`}
function schedulerPage(){const sec=sectionFilter==='all'?'all':(find(state.sections,sectionFilter)?sectionFilter:'all');const entries=state.schedules.filter(x=>sec==='all'||x.sectionId===sec).sort((a,b)=>weekdays.indexOf(a.day)-weekdays.indexOf(b.day)||a.start.localeCompare(b.start));const allReq=reqs().length;const issues=detectIssues();const filters=`<div class="toolbar"><div class="toolbar-left"><select class="select" data-control="section-filter"><option value="all" ${sec==='all'?'selected':''}>All sections</option>${state.sections.map(s=>`<option value="${s.id}" ${s.id===sec?'selected':''}>${esc(s.name)}</option>`).join('')}</select><span class="chip ${state.status==='Published'?'green':'amber'}">${state.status}</span><span class="ghost-text">${entries.length} sessions shown</span></div><div class="toolbar-right"><div class="segmented"><button data-action="calendar-mode" class="${scheduleMode==='calendar'?'active':''}">Weekly view</button><button data-action="table-mode" class="${scheduleMode==='table'?'active':''}">List view</button></div></div></div>`;const calendar=`<div class="day-grid">${weekdays.map(day=>`<div class="day-col"><h3>${day}</h3>${entries.filter(x=>x.day===day).sort((a,b)=>a.start.localeCompare(b.start)).map(x=>{const c=find(state.courses,x.courseId),s=find(state.sections,x.sectionId),f=find(state.faculty,x.facultyId);return `<div class="session ${c?.roomType==='Computer Lab'?'lab':''}"><strong>${esc(x.courseId)} · ${esc(s?.name)}</strong><span class="time">${timeRange(x)}</span><span>${esc(f?.name)}</span><span>${esc(x.roomId)}</span><div style="margin-top:9px">${btn('Edit assignment','edit-assignment','btn btn-sm','edit',`data-id="${esc(x.id)}"`)}</div></div>`}).join('')||'<div class="day-empty">No classes</div>'}</div>`).join('')}</div>`;const list=`<div class="table-wrap"><table class="data-table"><thead><tr><th>Section</th><th>Course</th><th>Professor</th><th>Classroom</th><th>Schedule</th><th>Actions</th></tr></thead><tbody>${entries.map(x=>`<tr><td><strong>${esc(find(state.sections,x.sectionId)?.name)}</strong></td><td><strong>${esc(x.courseId)}</strong><div class="ghost-text">${esc(find(state.courses,x.courseId)?.title)}</div></td><td>${esc(find(state.faculty,x.facultyId)?.name)}</td><td>${esc(x.roomId)}</td><td>${esc(x.day)}<div class="ghost-text">${timeRange(x)}</div></td><td>${btn('Edit','edit-assignment','btn btn-sm','edit',`data-id="${esc(x.id)}"`)}</td></tr>`).join('')||'<tr><td colspan="6" class="text-muted">No schedule assignments yet.</td></tr>'}</tbody></table></div>`;return `${head('Timetable workspace','Schedule builder',`Generate a collision-free draft, inspect weekly sessions and adjust faculty or room assignments.`,btn('Generate new draft','generate','btn btn-primary','bolt')+btn('Add assignment','add-assignment','btn','plus'))}<div class="kpi-grid">${statCard('Assigned meetings',state.schedules.length,`of ${allReq} course-block requirements`,'calendar')}${statCard('Active blocks',state.sections.length,'Sections included in this term','layers','purple')}${statCard('Conflict flags',issues.filter(x=>x.kind==='Conflict').length,'Hard constraint violations detected','shield','green')}${statCard('Unassigned courses',issues.filter(x=>x.kind==='Unassigned').length,'Still need valid placements','alert','amber')}</div>${issues.length?`<div class="alert">${ic('alert',15)} <b>${issues.length} issue(s) require attention.</b> Review details in the <button class="linkbtn" data-page="conflicts">Conflict Center</button> before publishing.</div>`:`<div class="alert green">${ic('check',15)} All ${allReq} required class assignments are present and satisfy validation checks.</div>`}<div class="panel"><div class="panel-head"><div><h2>${scheduleMode==='calendar'?'Weekly academic timetable':'Class assignments'}</h2><p>Sessions are organized by academic week, Monday to Friday.</p></div>${btn('Export CSV','export','btn btn-sm','download')}</div><div class="panel-body" style="padding-bottom:0">${filters}</div>${scheduleMode==='calendar'?calendar:list}</div><div class="rule"><b>Generation policy:</b> The prototype uses a deterministic greedy constraint search with faculty-ranked candidates. Each assignment is checked for professor/section/room overlap, teaching load, availability, room type and seating capacity. It may leave feasible assignments unresolved when a different global ordering would succeed; it is not a full optimization solver.</div>`}
function conflictPage(){const issues=detectIssues(),unassigned=issues.filter(x=>x.kind==='Unassigned'),bad=issues.filter(x=>x.kind==='Conflict');return `${head('Scheduling validation','Conflict center','Identify unassigned courses and violations before a timetable is approved.',btn('Validate again','validate','btn','refresh')+btn('Open schedule builder','scheduler','btn btn-primary','arrow'))}<div class="kpi-grid">${statCard('Total issues',issues.length,'Outstanding validation items','alert','amber')}${statCard('Unassigned classes',unassigned.length,'Required sessions without placement','layers','purple')}${statCard('Hard conflicts',bad.length,'Overlaps or constraint violations','shield','green')}${statCard('Validation rules',6,'Faculty · Section · Room · Load · Time · Facility','check')}</div>${issues.length?`<div class="panel"><div class="panel-head"><div><h2>Items needing resolution</h2><p>Every missing or invalid class is shown, with a reason.</p></div><span class="chip red">${issues.length} flagged</span></div><div class="panel-body">${issues.map(i=>`<div class="issue-card"><div class="status-line"><span class="chip ${i.kind==='Conflict'?'red':'amber'}">${esc(i.kind)}</span><strong>${esc(find(state.sections,i.sectionId)?.name)} · ${esc(i.courseId)}</strong></div><p>${esc(i.reason)}</p><div class="foot"><span class="ghost-text">${esc(find(state.courses,i.courseId)?.title)}</span>${btn('Resolve','resolve','btn btn-sm','arrow',`data-section="${esc(i.sectionId)}" data-course="${esc(i.courseId)}"`)}</div></div>`).join('')}</div></div>`:`<div class="panel">${empty('No scheduling conflicts detected','All required class meetings are assigned, and the current timetable meets the prototype constraints.','approvals','Continue to review')}</div>`}<div class="rule"><b>How to resolve:</b> Use the Resolve action to assign a compatible professor, day, time and room. If no combination is feasible, update professor availability, workload limits or room resources.</div>`}
function approvalsPage(){const issues=detectIssues(),eligible=issues.length===0&&state.schedules.length>0;return `${head('Governance workflow','Review & publish','Control when validated working schedules become the official academic timetable.',btn('Print / Save PDF','print','btn','printer'))}<div class="panel"><div class="panel-head"><div><h2>Schedule approval status</h2><p>Active academic term · AY 2026–2027, Semester 1</p></div>${statusBadge()}</div><div class="panel-body"><div class="stepper"><div class="step done"><span class="n">${ic('check',13)}</span> Generate draft</div><div class="step ${eligible?'done':''}"><span class="n">${eligible?ic('check',13):'2'}</span> Validate</div><div class="step ${state.status==='Published'?'done':''}"><span class="n">${state.status==='Published'?ic('check',13):'3'}</span> Publish</div></div><div class="stat-split" style="margin-top:0;margin-bottom:20px"><div class="mini-stat"><b>${state.schedules.length}/${reqs().length}</b><span>Required meetings assigned</span></div><div class="mini-stat"><b>${issues.length}</b><span>Blocking issues</span></div></div>${issues.length?`<div class="alert red">${ic('alert',16)} Publishing is blocked because ${issues.length} scheduling issue(s) remain.</div>`:`<div class="alert green">${ic('check',16)} Validation passed. The draft is eligible for publication.</div>`}<div class="actions" style="justify-content:flex-start">${btn('Publish approved schedule','publish','btn btn-primary','shield',`${!eligible?'disabled':''}`)}${btn('View assignments','scheduler','btn','calendar')}${btn('Export CSV','export','btn','download')}</div></div></div><div class="panel"><div class="panel-head"><div><h2>Publication history</h2><p>Revision tracking for official timetables</p></div></div><div class="panel-body">${state.version?`<div class="outline-list"><div class="outline-item">${ic('shield',19)}<div class="text"><strong>Revision ${state.version} · Last published timetable</strong><small>${state.publishedAt?form function logsPage(){const logs=state.logs.filter(x=>logFilter==='all'||x.type===logFilter);return `${head('Accountability','Activity & audit trail','Review schedule generation, edits, ranking changes and publication actions.',btn('Export activity CSV','export-logs','btn','download'))}<div class="toolbar"><div class="toolbar-left"><select class="select" data-control="log-filter"><option value="all" ${logFilter==='all'?'selected':''}>All activities</option>${['Schedule','Faculty','Catalog','Sections','Rooms','Ranking','Approval','System'].map(t=>`<option value="${t}" ${logFilter===t?'selected':''}>${t}</option>`).join('')}</select></div><span class="ghost-text">Showing ${logs.length} events · Current browser only</span></div><div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Event</th><th>Description</th><th>Category</th><th>Performed by</th><th>Timestamp</th></tr></thead><tbody>${logs.map(x=>`<tr><td><strong>${esc(x.action)}</strong></td><td style="min-width:230px;max-width:430px">${esc(x.details)}</td><td><span class="chip gray">${esc(x.type)}</span></td><td>${esc(x.user)}</td><td class="mono">${formatDate(x.at)}</td></tr>`).join('')||'<tr><td colspan="5" class="text-muted">No matching activities.</td></tr>'}</tbody></table></div></div><div class="rule"><b>Audit notice:</b> This local prototype stores sample user and timestamps in browser storage, not a trusted audit log. Real deployments require append-only server records, authenticated user IDs and retention policies.</div>`}
function render(){renderNav();const out={dashboard:overview,scheduler:schedulerPage,faculty:facultyPage,ranking:rankingPage,courses:coursesPage,sections:sectionsPage,rooms:roomsPage,conflicts:conflictPage,approvals:approvalsPage,logs:logsPage};document.getElementById('content').innerHTML=(out[page]||overview)();document.getElementById('brand-icon').innerHTML=ic('grid',23);document.getElementById('mobile-menu').innerHTML=ic('menu',20)}

function normalizeProspectusRow(row,year,semester){const keys=Object.keys(row);const get=(names)=>{const k=keys.find(x=>names.some(n=>x.toLowerCase().replace(/[^a-z]/g,'').includes(n)));return k?row[k]:''};const rawCode=String(get(['coursecode','code','subjectcode'])||'').trim();const prefix=String(get(['prefix','subject'])||'').trim();const number=String(get(['numericcode','coursenumber','number'])||'').trim();const code=rawCode||(prefix&&number?prefix+' '+number:'');const name=String(get(['coursetitle','coursename','title','description'])||'').trim();const num=x=>{const n=Number(String(x??'').replace(/,/g,''));return Number.isFinite(n)?n:0};const lec=num(get(['lecunits','lectureunits','lecture'])),lab=num(get(['labunits','laboratoryunits','lab'])),total=num(get(['units','totalunits','total']));const pre=String(get(['prerequisites','prerequisites','prerequisite'])||'').split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);return code&&name?{courseCode:code,courseName:name,lectureUnits:lec,laboratoryUnits:lab,totalUnits:total||lec+lab,prerequisites:pre,yearLevel:year,semester}:null}
function parseProspectusWorkbook(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=e=>{try{if(!window.XLSX)throw Error('Excel parser is unavailable. Use Demo Import or load the page with internet access.');const wb=XLSX.read(e.target.result,{type:'array'});const courses=[],invalid=[];wb.SheetNames.forEach(sn=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:'',raw:false,header:1});let year=0,semester=0,headers=null;rows.forEach((cells,i)=>{const text=cells.map(x=>String(x||'').trim()).join(' ');const ym=text.match(/(1st|2nd|3rd|4th|first|second|third|fourth)\s*year/i);if(ym)year=['1st','first'].includes(ym[1].toLowerCase())?1:['2nd','second'].includes(ym[1].toLowerCase())?2:['3rd','third'].includes(ym[1].toLowerCase())?3:4;const sm=text.match(/(first|1st|second|2nd)\s*semester/i);if(sm)semester=['first','1st'].includes(sm[1].toLowerCase())?1:2;const normalized=cells.map(x=>String(x||'').toLowerCase().replace(/[^a-z]/g,''));if(normalized.some(x=>x.includes('coursetitle')||x.includes('coursename'))){headers=cells.map((x,j)=>String(x||'').trim()||'Column '+j);return}if(headers&&year&&semester&&cells.some(Boolean)){const row=Object.fromEntries(headers.map((h,j)=>[h,cells[j]??'']));const c=normalizeProspectusRow(row,year,semester);if(c)courses.push(c);else if(text&&!/total|semester|year|curriculum/i.test(text))invalid.push(i+1)}})});const seen=new Set();const duplicates=[];const unique=courses.filter(c=>{const k=c.courseCode.toUpperCase();if(seen.has(k)){duplicates.push(c.courseCode);return false}seen.add(k);return true});resolve({filename:file.name,importedAt:new Date().toISOString(),courses:unique,duplicates,invalid})}catch(err){reject(err)}};reader.onerror=()=>reject(Error('The selected file could not be read.'));reader.readAsArrayBuffer(file)})}
function applyProspectus(p){const duplicateExisting=[],added=[];p.courses.forEach(c=>{const id=c.courseCode.toUpperCase().replace(/\s+/g,'');const existing=state.courses.find(x=>x.id.toUpperCase().replace(/\s+/g,'')===id);if(existing){duplicateExisting.push(c.courseCode);return}const category=specialties.find(s=>c.courseName.toLowerCase().includes(s.toLowerCase()))||'Programming';state.courses.push({id:c.courseCode.toUpperCase(),title:c.courseName,category,units:c.totalUnits,lecture:c.lectureUnits,lab:c.laboratoryUnits,hours:c.lectureUnits+c.laboratoryUnits,roomType:c.laboratoryUnits?'Computer Lab':'Lecture',prerequisites:c.prerequisites,yearLevel:c.yearLevel,semester:c.semester});added.push(c.courseCode)});state.prospectus={...p,courses:p.courses.map(c=>({...c,existing:duplicateExisting.includes(c.courseCode)}))};save();render();toast(`Imported ${added.length} new course${added.length===1?'':'s'}${duplicateExisting.length?`; ${duplicateExisting.length} duplicate${duplicateExisting.length===1?'':'s'} skipped`:'.'}`)}
function prospectusPreview(p){const groups={};p.courses.forEach(c=>(groups[`${c.yearLevel}-${c.semester}`]??=[]).push(c));return `<div class="alert blue"><b>Import preview</b><br>${p.courses.length} valid course records detected · ${p.duplicates?.length||0} duplicates in workbook · ${p.invalid?.length||0} unreadable rows.</div><div class="table-wrap"><table class="data-table"><thead><tr><th>Course code</th><th>Course name</th><th>Units</th><th>Lec</th><th>Lab</th></tr></thead><tbody>${p.courses.map(c=>`<tr><td><strong>${esc(c.courseCode)}</strong></td><td>${esc(c.courseName)}</td><td>${c.totalUnits}</td><td>${c.lectureUnits}</td><td>${c.laboratoryUnits}</td></tr>`).join('')}</tbody></table></div><p class="help">${Object.keys(groups).length} academic year/semester groupings recognized and retained for curriculum organization. Existing catalog records will not be overwritten.</p>`}
function importProspectusModal(){showModal('Import Academic Prospectus',`<div id="prospectus-import-body"><label class="light-section" style="display:block;text-align:center;border-style:dashed;padding:28px"><strong>Drop an Excel prospectus here</strong><p>or choose a file from your computer</p><input id="prospectus-file" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" style="margin-top:14px"/><p class="help">Accepted formats: .xlsx and .xls · Course codes, units, year and semester are detected automatically.</p></label><div style="margin-top:14px">${btn('Use demo prospectus','demo-prospectus','btn btn-quiet','sparkles')}</div></div>`,`${btn('Cancel','close-modal','btn')}${btn('Confirm import','confirm-prospectus','btn btn-primary','check','disabled')}`,true);document.getElementById('prospectus-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;const body=document.getElementById('prospectus-import-body');if(!/\.(xlsx|xls)$/i.test(file.name)){body.insertAdjacentHTML('beforeend','<div class="alert red" style="margin-top:14px">Unsupported file. Please choose an .xlsx or .xls workbook.</div>');return}body.innerHTML='<p class="note">Reading workbook and extracting course records…</p>';try{const p=await parseProspectusWorkbook(file);body.innerHTML=prospectusPreview(p);document.querySelector('[data-action="confirm-prospectus"]').disabled=!p.courses.length;document.querySelector('[data-action="confirm-prospectus"]').dataset.payload=encodeURIComponent(JSON.stringify(p))}catch(err){body.innerHTML=`<div class="alert red">${esc(err.message)}</div>`}}) }
function viewProspectusModal(){const p=state.prospectus;if(!p)return;const groups={};p.courses.forEach(c=>(groups[`${c.yearLevel}-${c.semester}`]??=[]).push(c));const sections=Object.entries(groups).sort(([a],[b])=>a.localeCompare(b)).map(([key,cs])=>{const [y,s]=key.split('-');const ordinal=y==='1'?'1st':y==='2'?'2nd':y==='3'?'3rd':y+'th';const total=cs.reduce((n,c)=>n+c.totalUnits,0);return `<div class="light-section" style="margin-bottom:14px"><h3 style="margin:0 0 11px">${ordinal} Year — ${s==='1'?'First':'Second'} Semester</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>Code</th><th>Course title</th><th>Lec</th><th>Lab</th><th>Units</th><th>Prerequisites</th></tr></thead><tbody>${cs.map(c=>`<tr><td><strong>${esc(c.courseCode)}</strong></td><td>${esc(c.courseName)}</td><td>${c.lectureUnits}</td><td>${c.laboratoryUnits}</td><td>${c.totalUnits}</td><td>${esc(c.prerequisites.join(', ')||'—')}</td></tr>`).join('')}</tbody></table></div><p class="help"><b>Semester total:</b> ${total} units · ${cs.length} courses</p></div>`}).join('');showModal('Academic Prospectus Viewer',`<div class="status-line"><span class="chip green">Imported</span><span class="ghost-text">${esc(p.filename)} · ${formatDate(p.importedAt)} · ${p.courses.length} courses</span></div><div style="margin-top:16px">${sections}</div>`,btn('Close','close-modal','btn'),true)}

function facultyModal(id=null){const f=id?find(state.faculty,id):null;const selected=f?.specialties||[];const dayselect=weekdays.map(d=>`<label class="checkday"><input type="checkbox" name="day" value="${d}" ${(f?.days||weekdays).includes(d)?'checked':''}/> ${d.slice(0,3)}</label>`).join('');showModal(f?'Edit faculty profile':'Add professor',`<form id="editor" data-form="faculty" data-id="${esc(id||'')}"><div class="form-grid">${field('Full name','name',f?.name||'')}${selector('Academic qualification','degree',['Bachelors','Masters','PhD'],f?.degree||'Masters')}${field('Department','department',f?.department||'Computer Science')}${field('Years of teaching','years',f?.years||5,'number',true,'min="0" max="60"')}${field('Maximum teaching hours / week','maxHours',f?.maxHours||12,'number',true,'min="1" max="60"')}<div class="field"><label>Subject specializations</label><select name="specialties" multiple size="5" style="height:109px">${specialties.map(s=>`<option value="${esc(s)}" ${selected.includes(s)?'selected':''}>${esc(s)}</option>`).join('')}</select><small>Ctrl/Cmd + click to select several areas</small></div><div class="field full"><label>Available weekdays</label><div class="pill-row">${dayselect}</div></div><div class="field full">${field('Previously taught course codes (comma separated)','taughtCourses',(f?.taughtCourses||[]).join(', '),'text',false,'placeholder="CS101, CS202"')}</div></div></form>`,footerSave())}

function modalSubmit(){const form=document.getElementById('editor');if(!form)return;if(!form.reportValidity())return;const type=form.dataset.form,id=form.dataset.id;const fd=new FormData(form);const val=x=>String(fd.get(x)||'').trim();const num=x=>Number(fd.get(x));if(type==='weights'){const next=Object.fromEntries(Object.keys(weights).map(k=>[k,num(k)]));if(Object.values(next).reduce((a,b)=>a+b,0)!==100){toast('Ranking weights must add up to exactly 100%.',true);return}weights=next;log('Ranking criteria updated',Object.entries(weights).map(([k,v])=>`${k}: ${v}%`).join('; '),'Ranking')}
 else if(type==='faculty'){const days=fd.getAll('day'),spec=[...form.querySelector('select[name=specialties]').selectedOptions].map(x=>x.value);if(!days.length||!spec.length){toast('Select at least one weekday and one specialization.',true);return}const f={id:id||'F'+Date.now(),name:val('name'),department:val('department'),degree:val('degree'),years:num('years'),maxHours:num('maxHours'),days,specialties:spec,taughtCourses:val('taughtCourses').toUpperCase().split(',').map(x=>x.trim()).filter(Boolean)};if(id){const old=find(state.faculty,id);const before=`Specialties: ${old.specialties.join(', ')}, availability: ${old.days.join('/')}, workload: ${old.maxHours}h`;Object.assign(old,f);log('Faculty profile updated',`${f.name}: ${before} → Specialties: ${f.specialties.join(', ')}, availability: ${days.join('/')}, workload: ${f.maxHours}h`,'Faculty')}else{state.faculty.push(f);log('Faculty added',f.name,'Faculty')}}
 else if(type==='course'){const existing=id?find(state.courses,id):null;const lec=num('lecture'),lab=num('lab');const c={id:val('id').toUpperCase(),title:val('title'),category:existing?.category||specialties[0],roomType:existing?.roomType||(lab>0?'Computer Lab':'Lecture'),units:lec+lab,lecture:lec,lab,hours:lec+lab};if(c.hours<1||c.hours>8){toast('Lecture + laboratory contact hours must be 1–8 hours.',true);return}const duplicate=state.courses.find(x=>x.id===c.id&&x.id!==id);if(duplicate){toast('This course code already exists.',true);return}if(id){const old=find(state.courses,id);if(!old){toast('The course could not be found.',true);return}const previousId=old.id;const before=`${old.title}, ${old.roomType}, ${old.hours}h`;Object.assign(old,c);if(previousId!==c.id){state.sections.forEach(s=>s.courses=s.courses.map(courseId=>courseId===previousId?c.id:courseId));state.schedules.forEach(s=>{if(s.courseId===previousId)s.courseId=c.id});state.faculty.forEach(f=>{f.taughtCourses=(f.taughtCourses||[]).map(courseId=>courseId===previousId?c.id:courseId)});if(rankingCourse===previousId)rankingCourse=c.id}log('Course updated',`${previousId===c.id?c.id:previousId+' → '+c.id}: ${before} → ${c.title}, ${c.roomType}, ${c.hours}h`,'Catalog')}else{state.courses.push(c);log('Course created',`${c.id} — ${c.title}`,'Catalog')}}
 else if(type==='section'){const courseIds=fd.getAll('course');if(!courseIds.length){toast('Select at least one required course.',true);return}const data={id:id||'B'+Date.now(),name:val('name'),program:val('program'),year:num('year'),students:num('students'),courses:courseIds};if(state.sections.some(s=>s.id!==id&&s.name.toLowerCase()===data.name.toLowerCase())){toast('A block with that name already exists.',true);return}if(id){const old=find(state.sections,id);const before=`${old.students} students; courses ${old.courses.join(', ')}`;Object.assign(old,data);log('Block updated',`${data.name}: ${before} → ${data.students} students; courses ${courseIds.join(', ')}`,'Sections')}else{state.sections.push(data);log('Block created',data.name,'Sections')}}
 else if(type==='room'){const r={id:val('id').toUpperCase(),name:val('name'),type:val('type'),capacity:num('capacity'),building:val('building')};if(!id&&find(state.rooms,r.id)){toast('Room code already exists.',true);return}if(id){const old=find(state.rooms,id);const before=`${old.type}, ${old.capacity} seats`;Object.assign(old,r);log('Classroom updated',`${r.id}: ${before} → ${r.type}, ${r.capacity} seats`,'Rooms')}else{state.rooms.push(r);log('Classroom added',r.name,'Rooms')}}
 else if(type==='assignment'){const entry={id:id||'S'+Date.now(),sectionId:id?find(state.schedules,id).sectionId:val('sectionId'),courseId:id?find(state.schedules,id).courseId:val('courseId'),facultyId:val('facultyId'),roomId:val('roomId'),day:val('day'),start:val('start')};const errors=validateEntry(entry,state.schedules,id||null);if(errors.length){document.getElementById('editor-errors').innerHTML=`<div class="alert red" style="margin:15px 0 0"><strong>Cannot save this assignment:</strong><ul style="margin:7px 0 0;padding-left:16px">${errors.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;toast('Assignment violates scheduling constraints.',true);return}if(id){const prev=find(state.schedules,id);const before=`${prev.facultyId} / ${prev.roomId} / ${prev.day} ${prev.start}`;Object.assign(prev,entry);log('Schedule assignment updated',`${entry.sectionId} · ${entry.courseId}: ${before} → ${entry.facultyId} / ${entry.roomId} / ${entry.day} ${entry.start}`,'Schedule')}else{state.schedules.push(entry);log('Manual assignment added',`${entry.sectionId} · ${entry.courseId} assigned to ${entry.facultyId}, ${entry.roomId}`,'Schedule')}state.unresolved=state.unresolved.filter(x=>!(x.sectionId===entry.sectionId&&x.courseId===entry.courseId));state.status='Draft';const preferred=rankFaculty(entry.courseId).at(0);if(preferred&&preferred.id!==entry.facultyId){log('Faculty recommendation overridden',`${entry.sectionId} ${entry.courseId}: selected ${entry.facultyId} instead of top-ranked ${preferred.id}.`,'Ranking')}}
 if(['faculty','course','section','room'].includes(type))state.status='Draft';
 closeModal();save();render();toast('Changes saved successfully.')}
function csvDownload(rows,filename){if(!rows.length){toast('There is no data to export.',true);return}const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}

function publish(){const issues=detectIssues();if(issues.length||!state.schedules.length){toast(`Cannot publish: ${issues.length} issues remain.`,true);return}state.publishedSchedules=structuredClone(state.schedules);state.version+=1;state.publishedAt=new Date().toISOString();state.status='Published';log('Schedule published',`Revision ${state.version}: ${state.schedules.length} validated assignments approved and published.`,'Approval');render();toast('Timetable published as revision '+state.version+'.')}
function generateConfirm(){showModal('Generate a fresh timetable',`<div class="alert blue">${ic('info',16)} The generator will replace the <b>working schedule</b> with a new draft. The last published revision, if any, remains stored.</div><p class="note">Scheduling uses faculty qualifications and weighted recommendations while respecting workload, time, room capacity, room type and no-overlap rules.</p><p class="note"><b>Current draft:</b> ${state.schedules.length} assignments. <b>Required:</b> ${reqs().length} meetings.</p>`,`${btn('Cancel','close-modal','btn')}${btn('Generate timetable','confirm-generate','btn btn-primary','bolt')}`)}
function printSchedule(){const rows=state.schedules.map(x=>`<tr><td>${esc(find(state.sections,x.sectionId)?.name)}</td><td>${esc(x.courseId)} — ${esc(find(state.courses,x.courseId)?.title)}</td><td>${esc(find(state.faculty,x.facultyId)?.name)}</td><td>${esc(x.roomId)}</td><td>${esc(x.day)} ${timeRange(x)}</td></tr>`).join('');const html=`<!doctype html><html><head><title>SchedMatrix Timetable</title><style>body{font:12px Arial;padding:32px;color:#13243d}h1{font-size:22px}p{color:#667}table{border-collapse:collapse;width:100%;margin-top:20px}th,td{border:1px solid #ccc;padding:9px;text-align:left}th{background:#eff4fa}@media print{body{padding:8px}}</style></head><body><h1>SchedMatrix · Academic Timetable</h1><p>AY 2026–2027 · Semester 1 · ${esc(state.status)} · Revision ${state.version}</p><table><thead><tr><th>Block</th><th>Course</th><th>Professor</th><th>Room</th><th>Meeting</th></tr></thead><tbody>${rows}</tbody></table><script>window.onload=()=>window.print()<\/script></body></html>`;const w=window.open('','_blank');if(!w){toast('Allow pop-ups to print or save as PDF.',true);return}w.document.write(html);w.document.close()}
function runAction(action,node){const id=node.dataset.id;switch(action){case 'toggle-menu':document.getElementById('sidebar').classList.toggle('open');document.getElementById('scrim').classList.toggle('open');break;case 'close-modal':closeModal();break;case 'import-prospectus':importProspectusModal();break;case 'demo-prospectus':{const p=prospectusDemo();showModal('Import Academic Prospectus',prospectusPreview(p),`${btn('Cancel','close-modal','btn')}${btn('Confirm import','confirm-prospectus','btn btn-primary','check')}`,true);document.querySelector('[data-action="confirm-prospectus"]').dataset.payload=encodeURIComponent(JSON.stringify(p));break}case 'view-prospectus':viewProspectusModal();break;case 'confirm-prospectus':{try{applyProspectus(JSON.parse(decodeURIComponent(node.dataset.payload||'')));closeModal()}catch(e){toast('No valid prospectus preview is available.',true)}break}case 'add-faculty':facultyModal();break;case 'edit-faculty':facultyModal(id);break;case 'add-course':courseModal();break;case 'edit-course':courseModal(id);break;case 'add-section':sectionModal();break;case 'edit-section':sectionModal(id);break;case 'add-room':roomModal();break;case 'edit-room':roomModal(id);break;case 'weights':weightsModal();break;case 'generate':generateConfirm();break;case 'confirm-generate':{const result=scheduleGenerate();closeModal();render();toast(`Created ${result.assigned} assignments; ${result.unassigned} unresolved.`);break}case 'add-assignment':assignmentModal();break;case 'edit-assignment':assignmentModal(id);break;case 'resolve':{const existing=state.schedules.find(x=>x.sectionId===node.dataset.section&&x.courseId===node.dataset.course);assignmentModal(existing?.id||null,node.dataset.section,node.dataset.course);break}case 'remove-assignment':{const a=find(state.schedules,id);if(!a)break;state.schedules=state.schedules.filter(x=>x.id!==id);state.status='Draft';log('Schedule assignment removed',`${a.sectionId} · ${a.courseId}: ${a.facultyId} / ${a.roomId}`,'Schedule');closeModal();render();toast('Assignment removed from working draft.');break}case 'save-modal':modalSubmit();break;case 'calendar-mode':scheduleMode='calendar';render();break;case 'table-mode':scheduleMode='table';render();break;case 'validate':render();toast(detectIssues().length?`${detectIssues().length} issue(s) found.`:'All assignments passed validation.');break;case 'publish':publish();break;case 'export':exportSchedules();break;case 'export-logs':exportLogs();break;case 'print':printSchedule();break;case 'scheduler':navigate('scheduler');break;case 'approvals':navigate('approvals');break;default:break}}
document.addEventListener('click',e=>{const action=e.target.closest('[data-action]');const nav=e.target.closest('[data-page]');if(action){e.preventDefault();runAction(action.dataset.action,action);return}if(nav){e.preventDefault();navigate(nav.dataset.page);return}if(e.target.matches('[data-backdrop]'))closeModal()});
document.addEventListener('change',e=>{const v=e.target;if(v.dataset.control==='ranking-course'){rankingCourse=v.value;render()}if(v.dataset.control==='section-filter'){sectionFilter=v.value;render()}if(v.dataset.control==='log-filter'){logFilter=v.value;render()}});
document.addEventListener('input',e=>{if(e.target.matches('[data-search]')){const pos=e.target.selectionStart;searchTerm=e.target.value;render();const n=document.querySelector('[data-search]');n?.focus();n?.setSelectionRange(pos,pos)}if(e.target.dataset.weight){const form=document.getElementById('editor');document.getElementById('v-'+e.target.dataset.weight).textContent=e.target.value+'%';document.getElementById('weights-total').textContent=Object.keys(weights).reduce((a,k)=>a+Number(form.elements[k].value),0)+'%'}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMenu()}});
document.getElementById('scrim').addEventListener('click',closeMenu);
if(state.logs.length===0){log('Demo environment initialized','Academic records and sample sections loaded.','System');const r=scheduleGenerate();log('Draft ready for review',`${r.assigned} class meetings scheduled for AY 2026–2027.`, 'Schedule')}
render();
</script>
</body>
</html>
